'200 g ricotta','60 g grated Parmesan','400 g tomato sauce','Olive oil','Salt and pepper'],directions:'Wash the spinach and sauté in a pan over high heat with oil until reduced. Drain and roughly chop.\nCook the pasta according to package instructions.\nPreheat oven to 200°C.\nIn a bowl, mix ricotta, Parmesan, salt, pepper, and cooled spinach. Gently stuff the pasta shells.\nPour tomato sauce into a baking dish, place stuffed pasta on top and sprinkle with Parmesan.\nBake 10-15 minutes. Serve immediately.',notes:''},vi:{title:'Pinalon nga Conchiglionis nga adunay Spinaka ug Keso',difficulty:'Sayon',ingredients:['12 conchiglionis (250 g)','300 g spinaka','200 g ricotta','60 g gibuak nga parmesan','400 g sarsa sa kamatis','Lana sa olibo','Asin ug paminta'],directions:'Hugasi ang spinaka ug igisa sa kawali sa mainiton nga lana hangtod mokunhod. Puga ug hasaha.\nLutua ang pasta sumala sa instruksyon sa pakete.\nPainita ang hurno sa 200°C.\nSa usa ka mangkok, ihalo ang ricotta, parmesan, asin, paminta, ug spinaka. Pun-a ang mga pasta.\nIbubo ang sarsa sa kamatis sa baking dish, ibutang ang pinalon nga pasta ug iwisik og parmesan.\nI-bake 10-15 minuto. Ihatag dayon.',notes:''}},{id:2,emoji:'🫓',category:'plats',tags:['vege'],author:'Bap',photo:PHOTOS[2]||null,servings:'4',prepTime:'15 min',cookTime:'20 min',totalTime:'35 min',bapRating:'',leahRating:'',fr:{title:'Khachapuris à l\'Épinard',difficulty:'Facile',ingredients:['1 pâte à pizza','250 g de feta','150 g de mozzarella râpée','Persil frais ou basilic','4 œufs + 1 pour la farce','2 gousses d\'ail','150 g d\'épinards frais','Huile d\'olive','Sel et poivre'],directions:'Préchauffer le four à 200°C.\nDans un saladier, mélanger la feta émiettée, la mozzarella, le persil haché et 1 œuf.\nFaire revenir l\'ail et les épinards dans l\'huile jusqu\'à réduction. Réserver.\nDiviser la pâte en 4 disques. Placer fromage puis épinards au centre. Étirer les bords en forme de bateau.\nEnfourner 15 min. Casser un œuf au centre, enfourner encore 4-5 min.\nSaler, poivrer, filet d\'huile et persil frais.',notes:'Inspiré d\'une recette géorgienne traditionnelle.'},en:{title:'Spinach Khachapuris',difficulty:'Easy',ingredients:['1 pizza dough','250 g feta','150 g grated mozzarella','Fresh parsley or basil','4 eggs + 1 for the filling','2 garlic cloves','150 g fresh spinach','Olive oil','Salt and pepper'],directions:'Preheat oven to 200°C.\nIn a bowl, mix crumbled feta, mozzarella, chopped parsley, and 1 egg.\nSauté garlic and spinach in oil until wilted. Set aside.\nDivide dough into 4 circles. Place cheese mixture then spinach in the centre. Shape edges like a boat.\nBake 15 min. Crack an egg in the centre, bake 4-5 more minutes.\nSeason with salt, pepper, olive oil, and fresh parsley.',notes:'Inspired by a traditional Georgian recipe.'},vi:{title:'Khachapuris nga adunay Spinaka',difficulty:'Sayon',ingredients:['1 masa sa pizza','250 g feta','150 g gibuak nga mozzarella','Presko nga parsley o basil','4 itlog + 1 alang sa palaman','2 ulo nga bawang','150 g presko nga spinaka','Lana sa olibo','Asin ug paminta'],directions:'Painita ang hurno sa 200°C.\nIhalo ang feta, mozzarella, ginitis nga parsley, ug 1 itlog.\nIgisa ang bawang ug spinaka sa lana hangtod mokunhod. Itagana.\nDibisyona ang masa sa 4 ka pabilog. Ibutang ang keso ug spinaka sa sentro. Pormahin ang mga kilid nga sama sa sakayan.\nI-bake 15 minuto. Basagi ang itlog sa sentro, i-bake pa og 4-5 minuto.\nTimplahan ug asin, paminta, lana sa olibo, ug presko nga parsley.',notes:'Inspirado sa tradisyonal nga resipe sa Georgia.'}},{id:3,emoji:'🍗',category:'plats',tags:[],author:'Ravin\'s grandmother',photo:PHOTOS[3]||null,servings:'4',prepTime:'',cookTime:'45 min',totalTime:'',bapRating:'3',leahRating:'',fr:{title:'Poulet Chettinad au Poivre (Inde)',difficulty:'',ingredients:['1 poulet ~1.5 kg (découpe curry)','3 càs huile','2 clous de girofle','2 gousses de cardamome','1 bâton de cannelle','3 oignons rouges','2 tomates en dés','4 gousses d\'ail + gingembre (pilés)','½ càc curcuma','1-1½ tasse d\'eau','Feuilles de curry','Sel','MASALA : 2 càs poivre noir, 1 càc fenouil, 1 càc cumin, 1 càs coriandre, 2-3 piments rouges'],directions:'Faire griller à sec les épices du masala 3-5 min. Laisser refroidir puis mixer en poudre.\nChauffer l\'huile, ajouter les épices entières, puis les oignons salés. Faire dorer. Ajouter ail et gingembre, puis les tomates. Ajouter le curcuma.\nAjouter le poulet. Une fois rosé, ajouter l\'eau. Cuire à découvert 15 min.\nAjouter le masala. Cuire jusqu\'à évaporation. Ajouter les feuilles de curry. Couvrir 10 min. Assaisonner.',notes:'Recette de la grand-mère de Ravin.'},en:{title:'Indian Chettinad Pepper Chicken',difficulty:'',ingredients:['1 chicken ~1.5 kg (curry cut)','3 tbsp oil','2 cloves','2 cardamom pods','1 cinnamon stick','3 red onions','2 diced tomatoes','4 garlic cloves + thumb-sized ginger (pounded)','½ tsp turmeric','1-1½ cups water','Curry leaves','Salt','MASALA: 2 tbsp black peppercorns, 1 tsp fennel, 1 tsp cumin, 1 tbsp coriander, 2-3 dried chillies'],directions:'Dry roast masala spices 3-5 min. Cool then grind to powder.\nHeat oil, add whole spices, then salted onions. Brown. Add garlic and ginger, then tomatoes. Add turmeric.\nAdd chicken. Once no longer pink, add water. Cook uncovered 15 min.\nAdd masala powder. Cook until moisture evaporates. Add curry leaves. Cover 10 min. Season.',notes:'Ravin\'s grandmother\'s recipe.'},vi:{title:'Indyano nga Chettinad Pepper Manok',difficulty:'',ingredients:['1 manok ~1.5 kg (curry cut)','3 kutsara nga lana','2 cloves','2 cardamom pods','1 butil nga kanela','3 pulang sibuyas','2 kamatis, diced','4 ulo bawang + luya (ginukod)','½ kutsarita curcuma','1-1½ tasa tubig','Mga dahon sa curry','Asin','MASALA: 2 kutsara itom nga paminta, 1 kutsarita anis, 1 kutsarita cumin, 1 kutsara coriander, 2-3 pula nga sili'],directions:'Tutoa ang mga espesya sa masala og 3-5 minuto. Pabugnawa ug ibungkag sa pulbo.\nPainita ang lana, idugang ang mga espesya, dayon ang sibuyas nga may asin. Iprito. Idugang ang bawang ug luya, dayon ang kamatis. Idugang ang curcuma.\nIdugang ang manok. Kung wala nay pula, idugang ang tubig. Lutua nga bukas 15 minuto.\nIdugang ang masala. Lutua hangtod mawala ang katubigan. Idugang ang mga dahon sa curry. Tabunan og 10 minuto. Timplahan.',notes:'Resipe sa lola ni Ravin.'}},{id:4,emoji:'🍝',category:'plats',tags:['vege','rapide'],author:'',photo:PHOTOS[4]||null,servings:'4',prepTime:'15 min',cookTime:'10 min',totalTime:'25 min',bapRating:'',leahRating:'',fr:{title:'Pasta à la Betterave Rose',difficulty:'Facile',ingredients:['250 g de ricotta','250 g de betterave cuite','350 g de pâtes (penne)','50 g de parmesan râpé','Basilic violet si possible','Huile d\'olive','Sel et poivre'],directions:'Mixer la ricotta et la betterave coupée. Ajouter sel, poivre et un filet d\'huile. La sauce rose est prête !\nCuire les pâtes aux ¾ du temps indiqué. Égoutter (garder l\'eau de cuisson).\nTransférer dans une sauteuse avec un filet d\'huile. Ajouter la sauce avec une louche d\'eau de cuisson. Bien mélanger.\nHors du feu, ajouter le parmesan. Garnir de basilic.',notes:''},en:{title:'Pink Beetroot Pasta',difficulty:'Easy',ingredients:['250 g ricotta','250 g cooked beetroot','350 g pasta (penne)','50 g grated Parmesan','Purple basil if possible','Olive oil','Salt and pepper'],directions:'Blend the ricotta and chopped beetroot together. Season with salt, pepper and a drizzle of oil. Pink sauce ready!\nCook pasta for ¾ of the indicated time. Drain (keep some cooking water).\nTransfer to a pan with a drizzle of oil. Add the sauce and a ladle of pasta water. Mix well.\nOff the heat, add Parmesan. Garnish with basil.',notes:''},vi:{title:'Rosas nga Pasta sa Betabol',difficulty:'Sayon',ingredients:['250 g ricotta','250 g niluto nga betabol','350 g pasta (penne)','50 g gibuak nga parmesan','Violet nga basil kung anaa','Lana sa olibo','Asin ug paminta'],directions:'Ibungkag ang ricotta ug ginputol nga betabol. Timplahan sa asin, paminta, ug gamay nga lana. Handa na ang rosas nga sarsa!\nLutua ang pasta sa ¾ sa gipaila nga oras. Ilabay ang tubig (tipiga ang tubig sa pagluto).\nIbalhin sa kawali nga may lana. Idugang ang sarsa ug kulo sa tubig sa pasta. Ihalo pag-ayo.\nGawas sa init, idugang ang parmesan. Dekorahan og basil.',notes:''}},{id:5,emoji:'🍋',category:'plats',tags:[],author:'Coco',photo:PHOTOS[5]||null,servings:'4',prepTime:'1h (marinade)',cookTime:'30 min',totalTime:'',bapRating:'',leahRating:'',fr:{title:'Tajine de Poulet aux Olives et Citrons Confits',difficulty:'',ingredients:['5 gousses d\'ail hachées','¼ càc safran','½ càc gingembre','1 càc paprika doux','½ càc cumin','½ càc curcuma','Sel et poivre','1 poulet en 8-10 morceaux','2 càs huile d\'olive','3 oignons émincés','1 bâton de cannelle','8 olives kalamata dénoyautées','8 olives vertes','1 citron confit','1 tasse de bouillon de poulet','Jus de ½ citron','1 càs persil plat'],directions:'Mélanger ail, safran, épices. Frotter le poulet. Réfrigérer 3-4h.\nDorer le poulet. Retirer. Faire dorer les oignons 15 min. Mettre dans le tajine avec la cannelle.\nPoser le poulet. Ajouter olives et citron confit en lanières. Verser bouillon + jus de citron.\nCouvrir, cuire à feu doux 30 min. Parsemer de persil.',notes:''},en:{title:'Chicken Tagine with Olives and Preserved Lemons',difficulty:'',ingredients:['5 garlic cloves, chopped','¼ tsp saffron','½ tsp ginger','1 tsp sweet paprika','½ tsp cumin','½ tsp turmeric','Salt and pepper','1 chicken in 8-10 pieces','2 tbsp olive oil','3 sliced onions','1 cinnamon stick','8 pitted kalamata olives','8 cracked green olives','1 preserved lemon','1 cup chicken stock','Juice of ½ lemon','1 tbsp flat-leaf parsley'],directions:'Mix garlic, saffron and spices. Rub chicken. Refrigerate 3-4 hours.\nBrown chicken. Remove. Brown onions 15 min. Transfer to tagine with cinnamon.\nPlace chicken on onions. Add olives and lemon strips. Pour stock + lemon juice.\nCover, cook on low heat 30 min. Scatter parsley.',notes:''},vi:{title:'Tagine nga Manok nga adunay Olibo ug Preserved Limón',difficulty:'',ingredients:['5 ulo bawang, ginitis','¼ kutsarita safron','½ kutsarita luya','1 kutsarita matamis nga paprika','½ kutsarita cumin','½ kutsarita curcuma','Asin ug paminta','1 manok nga giputol og 8-10 piraso','2 kutsara lana sa olibo','3 sibuyas, gilabha','1 butil kanela','8 kalamata olibo','8 berde nga olibo','1 preserved na limon','1 tasa chicken stock','Katas sa ½ limon','1 kutsara parsley'],directions:'Ihalo ang bawang, safron, ug mga espesya. Ihaplid sa manok. Ibutang sa ref 3-4 ka oras.\nIprito ang manok. Kuhaa. Iprito ang sibuyas 15 minuto. Ibalhin sa tagine nga may kanela.\nIbutang ang manok. Idugang ang olibo ug ginabli nga limon. Ibubo ang stock + katas sa limon.\nTabunan, lutua sa mahinay nga apoy og 30 minuto. Iwisik og parsley.',notes:''}},{id:6,emoji:'🥞',category:'desserts',tags:['vege'],author:'',photo:PHOTOS[6]||null,servings:'15-20',prepTime:'30 min',cookTime:'20 min',totalTime:'50 min',bapRating:'',leahRating:'',fr:{title:'Crêpes Faciles pour la Chandeleur',difficulty:'Facile',ingredients:['250 g de farine T55 (ou 50 g maïzena)','4 œufs','450 ml de lait tiède','2 càs de rhum ou eau de fleur d\'oranger','1 càs d\'extrait de vanille','2 càs de sucre','1 pincée de sel','50 g de beurre fondu'],directions:'Faire fondre le beurre et tiédir le lait.\nMélanger farine, sucre et sel. Ajouter les œufs, le beurre, puis le lait en fouettant progressivement.\nAjouter le rhum et la vanille. Laisser reposer 30 min.\nCuire les crêpes dans une poêle beurrée des deux côtés jusqu\'à ce qu\'elles soient dorées.',notes:''},en:{title:'Easy Crêpes for Candlemas',difficulty:'Easy',ingredients:['250 g flour T55 (or replace 50 g with cornstarch)','4 eggs','450 ml slightly warm milk','2 tbsp rum or orange blossom water','1 tbsp vanilla extract','2 tbsp sugar','1 pinch of salt','50 g melted butter'],directions:'Melt the butter and warm the milk slightly.\nMix flour, sugar and salt. Add eggs, butter, then gradually add milk while whisking.\nAdd rum and vanilla. Rest 30 min.\nCook crêpes in a buttered pan on both sides until golden.',notes:''},vi:{title:'Mga Crepe para sa Candelaria',difficulty:'Sayon',ingredients:['250 g harina (o 50 g cornstarch)','4 itlog','450 ml nga gamay nga mainit nga gatas','2 kutsara rum o orange blossom water','1 kutsara vanilla extract','2 kutsara asukar','1 kurot asin','50 g natunaw nga mantequilya'],directions:'Tunawon ang mantequilya ug ipahinit gamay ang gatas.\nIhalo ang harina, asukar, ug asin. Idugang ang mga itlog, mantequilya, dayon idugang ang gatas nga hinayhinay nga ginagubok.\nIdugang ang rum ug vanilla. Pahuwaya og 30 minuto.\nIluto ang mga crepe sa gisapan nga mantequilya sa duha ka kilid hangtod mahimong bulawan.',notes:''}},{id:7,emoji:'🍮',category:'desserts',tags:[],author:'Papa Alain',photo:PHOTOS[7]||null,servings:'6',prepTime:'25 min',cookTime:'30 min',totalTime:'1h',bapRating:'',leahRating:'',fr:{title:'Flan Pâtissier de Christophe Michalak',difficulty:'Facile',ingredients:['600 g de lait entier','160 g de crème liquide entière','1 gousse de vanille','130 g de sucre fin','60 g de maïzena','6 jaunes d\'œufs','1 pincée de sel'],directions:'Chauffer lait, crème et vanille jusqu\'à frémissement. Infuser 20 min.\nMélanger sucre et maïzena. Ajouter les jaunes et le sel.\nVerser dans le lait chaud. Cuire jusqu\'au premier bouillon.\nMixer au plongeant, retirer la vanille. Verser dans un moule 24 cm beurré.\nLaisser former une croûte (15-20 min) puis cuire 30 min à 180°C chaleur tournante.',notes:''},en:{title:'Christophe Michalak\'s Pastry Flan',difficulty:'Easy',ingredients:['600 g whole milk','160 g heavy cream','1 vanilla pod','130 g caster sugar','60 g cornstarch','6 egg yolks','1 pinch of salt'],directions:'Heat milk, cream and vanilla to a simmer. Infuse 20 min.\nMix sugar and cornstarch. Add egg yolks and salt.\nPour into hot milk. Cook until first boil.\nBlend with immersion blender, remove vanilla. Pour into a greased 24 cm mould.\nLet a crust form (15-20 min) then bake 30 min at 180°C fan.',notes:''},vi:{title:'Pastry Flan ni Christophe Michalak',difficulty:'Sayon',ingredients:['600 g tibuok nga gatas','160 g heavy cream','1 vanilla pod','130 g pino nga asukar','60 g cornstarch','6 pula sa itlog','1 kurot asin'],directions:'Painita ang gatas, cream, ug vanilla hangtod magsugod og kulo. Pasarona og 20 minuto.\nIhalo ang asukar ug cornstarch. Idugang ang pula sa itlog ug asin.\nIbubo sa mainit nga gatas. Lutua hangtod sa unang kulo.\nIbungkag gamit ang immersion blender, tangtanga ang vanilla. Ibubo sa 24 cm nga gisapan og mantequilya.\nPabiyaa nga maporma ang balat (15-20 min) unya i-bake 30 minuto sa 180°C.',notes:''}},{id:8,emoji:'🥒',category:'entrees',tags:['vege'],author:'Emmanuelle Jary',photo:PHOTOS[8]||null,servings:'6',prepTime:'20 min',cookTime:'45 min',totalTime:'1h05',bapRating:'',leahRating:'',fr:{title:'Terrine de Courgettes Basilic & Parmesan',difficulty:'',ingredients:['5 courgettes','4 càs huile d\'olive','4 gousses d\'ail émincées','2 càs persil plat','80 g parmesan râpé','3 càs chapelure','4 œufs','1 bouquet basilic','1 bouquet ciboulette','250 ml crème épaisse','2 càs moutarde','Sel et poivre'],directions:'Couper 4 courgettes en cubes. Faire sauter dans l\'huile avec ail, persil, basilic. Saler, poivrer. Cuire 20-30 min.\nBattre les œufs avec chapelure et parmesan. Écraser les courgettes cuites et mélanger.\nÉmincer la 5e courgette, faire sauter 1 min. Tapisser un moule. Verser le mélange. Cuire au bain-marie à 180°C 45 min.\nSauce : crème + moutarde + ciboulette. Démouler froid.',notes:''},en:{title:'Zucchini Terrine with Basil & Parmesan',difficulty:'',ingredients:['5 zucchinis','4 tbsp olive oil','4 minced garlic cloves','2 tbsp flat-leaf parsley','80 g grated Parmesan','3 tbsp breadcrumbs','4 eggs','1 bunch basil','1 bunch chives','250 ml thick cream','2 tbsp mustard','Salt and pepper'],directions:'Cube 4 zucchinis. Sauté in oil with garlic, parsley, basil. Season. Cook 20-30 min.\nBeat eggs with breadcrumbs and Parmesan. Crush cooked zucchini and combine.\nSlice 5th zucchini thinly, sauté 1 min. Line a loaf tin. Pour mixture. Bake in a water bath at 180°C 45 min.\nSauce: cream + mustard + chives. Unmould cold.',notes:''},vi:{title:'Terrine sa Zucchini nga adunay Basil ug Parmesan',difficulty:'',ingredients:['5 zucchini','4 kutsara lana sa olibo','4 ulo bawang, ginitis','2 kutsara parsley','80 g gibuak nga parmesan','3 kutsara breadcrumbs','4 itlog','1 bugkos basil','1 bugkos chives','250 ml espesong krema','2 kutsara mustard','Asin ug paminta'],directions:'Putlon og cubo ang 4 ka zucchini. Igisa sa lana nga may bawang, parsley, basil. Timplahan. Lutua 20-30 minuto.\nPisaka ang mga itlog nga may breadcrumbs ug parmesan. Giyasgayan ang niluto nga zucchini ug ihalo.\nGalabon ang ika-5 zucchini, igisa 1 minuto. Tapetahan ang mold. Ibubo ang halo. I-bake sa bain-marie sa 180°C 45 minuto.\nSarsa: krema + mustard + chives. Ilusot nga bugnaw.',notes:''}},{id:9,emoji:'🥧',category:'plats',tags:['vege'],author:'Arnaud Dalibot',photo:PHOTOS[9]||null,servings:'4-6',prepTime:'',cookTime:'50 min',totalTime:'',bapRating:'',leahRating:'',fr:{title:'Quiche Poireau, Courge & Oseille',difficulty:'',ingredients:['1 pâte filo','3 œufs','150 ml lait','200 ml crème liquide','1 càc curry','250 g butternut','220 g poireau','80 g oseille','100 g comté râpé','1 càs graines de pavot','Sel et poivre'],directions:'Précuire la pâte 10 min à 180°C. Couper butternut en tranches 0,5 cm, couper poireau et oseille grossièrement.\nBattre œufs avec lait, crème, curry, sel et poivre. Déposer la garniture sur la pâte. Verser l\'appareil.\nParsemer de comté et pavot. Cuire 40 min à 180°C.',notes:''},en:{title:'Leek, Squash & Sorrel Quiche',difficulty:'',ingredients:['1 filo pastry','3 eggs','150 ml milk','200 ml liquid cream','1 tsp curry','250 g butternut squash','220 g leek','80 g sorrel','100 g grated Comté','1 tbsp poppy seeds','Salt and pepper'],directions:'Prebake pastry 10 min at 180°C. Slice squash 0.5 cm thick, roughly chop leek and sorrel.\nWhisk eggs with milk, cream, curry, salt and pepper. Arrange filling on pastry. Pour egg mixture.\nSprinkle with Comté and poppy seeds. Bake 40 min at 180°C.',notes:''},vi:{title:'Quiche nga adunay Leek, Kalabasa ug Oseille',difficulty:'',ingredients:['1 filo pastry','3 itlog','150 ml gatas','200 ml likido nga krema','1 kutsarita curry','250 g butternut squash','220 g leek','80 g oseille','100 g gibuak nga comté','1 kutsara poppy seeds','Asin ug paminta'],directions:'I-prebake ang pastry og 10 minuto sa 180°C. Galabona ang squash sa 0.5 cm, putulon ang leek ug oseille.\nPisaka ang mga itlog nga may gatas, krema, curry, asin ug paminta. Butangan og filling ang pastry. Ibubo ang halo.\nIwisik og comté ug poppy seeds. I-bake 40 minuto sa 180°C.',notes:''}},{id:10,emoji:'🍗',category:'plats',tags:[],author:'Gaston Gérard',photo:null,servings:'4',prepTime:'',cookTime:'45 min',totalTime:'',bapRating:'',leahRating:'',fr:{title:'Poulet Gaston Gérard',difficulty:'',ingredients:['1 poulet ou 4 cuisses','50 g beurre','1 oignon','3 gousses d\'ail','2 càs moutarde à l\'ancienne','1 càs paprika','150 ml vin blanc','250 g crème fraîche épaisse','150 g comté râpé','Sel et poivre'],directions:'Préchauffer le four à 180°C.\nDorer le poulet dans le beurre à feu vif. Saler, papriquer. Retirer.\nFaire dorer oignon et ail. Déglacer avec le vin blanc, réduire de moitié. Ajouter moutarde, crème et 100 g comté. Remettre le poulet.\nParsemer 50 g comté, gratiner au four 25 min.\nServir avec pommes de terre, riz ou pâtes.',notes:''},en:{title:'Gaston Gérard Chicken',difficulty:'',ingredients:['1 whole chicken or 4 thighs','50 g butter','1 onion','3 garlic cloves','2 tbsp wholegrain mustard','1 tbsp paprika','150 ml white wine','250 g thick cream','150 g grated Comté','Salt and pepper'],directions:'Preheat oven to 180°C.\nBrown chicken in butter over high heat. Season and add paprika. Remove.\nBrown onion and garlic. Deglaze with wine, reduce by half. Add mustard, cream and 100 g Comté. Return chicken.\nSprinkle 50 g Comté, gratin in oven 25 min.\nServe with potatoes, rice or pasta.',notes:''},vi:{title:'Manok Gaston Gérard',difficulty:'',ingredients:['1 tibuok manok o 4 ka paa','50 g mantequilya','1 sibuyas','3 ulo bawang','2 kutsara wholegrain mustard','1 kutsara paprika','150 ml puting bino','250 g espesong krema','150 g gibuak nga comté','Asin ug paminta'],directions:'Painita ang hurno sa 180°C.\nIprito ang manok sa mantequilya sa mainiton nga apoy. Timplahan ug paprika. Kuhaa.\nIprito ang sibuyas ug bawang. Ibubo ang bino, ubsan sa katunga. Idugang ang mustard, krema ug 100 g comté. Iuli ang manok.\nIwisik og 50 g comté, i-gratin sa hurno 25 minuto.\nIhatag nga may patatas, bugas, o pasta.',notes:''}},{id:11,emoji:'🐇',category:'plats',tags:[],author:'Mamie',photo:null,servings:'',prepTime:'',cookTime:'',totalTime:'',bapRating:'',leahRating:'',fr:{title:'Lapin Corse de Mamie',difficulty:'',ingredients:[],directions:'',notes:'Recette à compléter !'},en:{title:'Grandma\'s Corsican Rabbit',difficulty:'',ingredients:[],directions:'',notes:'Recipe to be completed!'},vi:{title:'Koneho ni Lola gikan sa Corsica',difficulty:'',ingredients:[],directions:'',notes:'Resipe nga ipuno pa!'}},{id:12,emoji:'🥗',category:'salades',tags:['vege','rapide'],author:'Maman Chommeloux',photo:null,servings:'4',prepTime:'15 min',cookTime:'',totalTime:'15 min',bapRating:'',leahRating:'',fr:{title:'Salade Piémontaise',difficulty:'Très facile',ingredients:['1 kg de pommes de terre à chair ferme, cuites et émincées','Œufs durs, tranchés','Cornichons, 1 petit pot, émincés','Tomates cerises, coupées en deux','1 échalote, finement hachée','1 pot de mayonnaise','Sel, poivre','Persil ou ciboulette (optionnel)'],directions:'Mélanger tous les ingrédients ensemble. Servir très frais.',notes:'Ma version est un mix entre la salade piémontaise (sans jambon) et la salade de pommes de terre avec œufs durs.'},en:{title:'Piedmontese Potato Salad',difficulty:'Very easy',ingredients:['1 kg firm-fleshed potatoes, cooked and sliced','Hard-boiled eggs, sliced','Pickles, 1 small jar, sliced','Cherry tomatoes, halved','1 shallot, finely chopped','1 jar of mayonnaise','Salt and pepper','Parsley or chives (optional)'],directions:'Mix all ingredients together. Serve very cold.',notes:'My version is a mix between Piedmontese salad (without ham) and potato salad with hard-boiled eggs.'},vi:{title:'Ensalada Piemontesa',difficulty:'Sayon Kaayo',ingredients:['1 kg patatas nga niluto ug gilabha','Nilugang itlog, gilabha','Pickles, 1 gagmay nga garapon, gilabha','Cherry kamatis, gibahin','1 shallot, ginitis','1 garapon mayonnaise','Asin ug paminta','Parsley o chives (opsyonal)'],directions:'Ihalo ang tanan nga sangkap. Ihatag nga bugnaw kaayo.',notes:'Ang akong bersyon kay halo sa Piedmontese salad (wala\'y ham) ug patatas salad nga may nilugang itlog.'}},{id:13,emoji:'🫘',category:'salades',tags:['vege','healthy'],author:'Maman Chommeloux',photo:null,servings:'',prepTime:'5 min',cookTime:'',totalTime:'5 min',bapRating:'',leahRating:'',fr:{title:'Salade de Lentilles au Vinaigre de Framboise',difficulty:'Très facile',ingredients:['Lentilles vertes cuites et refroidies','Coriandre fraîche, 1 beau bouquet, grossièrement haché','Vinaigre de framboise (généreusement)','Huile d\'olive'],directions:'Mélanger les lentilles et la coriandre, assaisonner généreusement avec l\'huile d\'olive et beaucoup de vinaigre de framboise.',notes:''},en:{title:'Lentil Salad with Raspberry Vinegar',difficulty:'Very easy',ingredients:['Cooked and cooled green lentils','Fresh coriander, 1 generous bunch, roughly chopped','Raspberry vinegar (use generously)','Olive oil'],directions:'Mix the lentils and coriander, then season to taste with olive oil and plenty of raspberry vinegar — it should be the dominant flavour.',notes:''},vi:{title:'Ensalada sa Lentil nga adunay Raspberry Vinegar',difficulty:'Sayon Kaayo',ingredients:['Niluto ug gipabugnaw nga berdeng lentil','Presko nga coriander, 1 dako nga bugkos, gihasah','Raspberry vinegar (madagayaon)','Lana sa olibo'],directions:'Ihalo ang lentil ug coriander, dayon timplahan og madagayaon nga lana sa olibo ug daghang raspberry vinegar — kinahanglan kini ang nag-unang lami.',notes:''}},{id:14,emoji:'🥦',category:'salades',tags:['vege','healthy'],author:'Bryan Johnson',photo:null,servings:'4',prepTime:'',cookTime:'20 min',totalTime:'',bapRating:'',leahRating:'',fr:{title:'Super Veggie (Bryan Johnson)',difficulty:'',ingredients:['90 g lentilles noires sèches (~300 g cuites)','500 g brocoli (tête + tige)','300 g chou-fleur','100 g champignons shiitake ou maitake','2 gousses d\'ail','6 g gingembre frais','2 citrons verts','2 càs cumin','2 càs vinaigre de cidre','2 càs graines de chanvre (si possible)','2 càs huile d\'olive extra vierge'],directions:'Bouillir brocoli, chou-fleur, champignons, gingembre et ail 7-9 min.\nCuire les lentilles 18-20 min al dente. Égoutter.\nMixer cumin, vinaigre, citron vert, lentilles et légumes. Texture de soupe épaisse.\nGarnir de graines de chanvre.',notes:'Bien préparé, le goût doit être doux et facile. Pas d\'odeur d\'ail.'},en:{title:'Super Veggie (Bryan Johnson)',difficulty:'',ingredients:['90 g dry black lentils (~300 g cooked)','500 g broccoli (head + stalk)','300 g cauliflower','100 g shiitake or maitake mushrooms','2 garlic cloves','6 g fresh ginger','2 limes','2 tbsp cumin','2 tbsp apple cider vinegar','2 tbsp hemp seeds (if possible)','2 tbsp extra-virgin olive oil'],directions:'Boil broccoli, cauliflower, mushrooms, ginger and garlic 7-9 min.\nCook lentils 18-20 min al dente. Drain.\nBlend cumin, vinegar, lime, lentils and vegetables into a thick soup texture.\nTop with hemp seeds.',notes:'When properly made, the taste should be smooth and easy. No garlic smell.'},vi:{title:'Super Utan (Bryan Johnson)',difficulty:'',ingredients:['90 g uga nga itom nga lentil (~300 g niluto)','500 g brokoli','300 g cauliflower','100 g shiitake o maitake nga uhong','2 ulo bawang','6 g presko nga luya','2 dayap nga berde','2 kutsara cumin','2 kutsara apple cider vinegar','2 kutsara hemp seeds','2 kutsara extra-virgin olive oil'],directions:'Pakuloa ang brokoli, cauliflower, uhong, luya ug bawang og 7-9 minuto.\nLutua ang lentil og 18-20 minuto al dente. Ilabay ang tubig.\nIbungkag ang cumin, vinegar, dayap, lentil ug mga gulay hangtod mahimong espesong sopas.\nDekorahan og hemp seeds.',notes:'Kung luto sa hustong paagi, ang lami kinahanglan nga hapsay ug sayon. Walay baho sa bawang.'}},{id:15,emoji:'🍉',category:'entrees',tags:['vege','healthy','rapide'],author:'Doug Lang',photo:null,servings:'6',prepTime:'15 min',cookTime:'',totalTime:'15 min',bapRating:'',leahRating:'',fr:{title:'Gazpacho à la Pastèque',difficulty:'Facile',ingredients:['1 grande tomate','1 pastèque 3-4 kg, pelée, épépinée, en cubes','1 grand concombre, pelé, épépiné, en dés','2 branches de céleri en dés','Jus d\'1 citron vert','2 càs feuilles de menthe','2 càs persil','1 càs vinaigre de Xérès','⅛ càc poivre noir','3 càs feta allégée émiettée'],directions:'Blanchir la tomate 1 min, éplucher. Mettre dans le blender.\nRéserver ¼ de la pastèque, concombre et céleri. Mixer le reste avec le citron vert, la menthe, le persil, le vinaigre et le poivre. Réfrigérer.\nServir dans des bols froids avec la garniture. Saupoudrer de feta.',notes:''},en:{title:'Watermelon Gazpacho',difficulty:'Easy',ingredients:['1 large tomato','1 watermelon 3-4 kg, peeled, seeded, cubed','1 large cucumber, peeled, seeded, diced','2 celery stalks, diced','Juice of 1 lime','2 tbsp mint leaves','2 tbsp parsley','1 tbsp sherry vinegar','⅛ tsp black pepper','3 tbsp low-fat feta, crumbled'],directions:'Blanch tomato 1 min, peel. Transfer to blender.\nSet aside ¼ of the watermelon, cucumber and celery. Blend the rest with lime, mint, parsley, vinegar and pepper. Refrigerate.\nServe in chilled bowls with the reserved garnish. Sprinkle feta.',notes:''},vi:{title:'Gazpacho sa Pakwan',difficulty:'Sayon',ingredients:['1 dako nga kamatis','1 pakwan 3-4 kg, gibaril, gibuhat og cubo','1 dako nga pipino, gibaril, diced','2 tangkay celery, diced','Katas sa 1 dayap nga berde','2 kutsara mint','2 kutsara parsley','1 kutsara sherry vinegar','⅛ kutsarita itom nga paminta','3 kutsara feta, gibuak'],directions:'Lutua ang kamatis sa mainit nga tubig og 1 minuto, aniton ang panit. Ibalhin sa blender.\nItagana ang ¼ sa pakwan, pipino ug celery. Ibungkag ang nahibilin nga may dayap, mint, parsley, vinegar ug paminta. Ibutang sa ref.\nIhatag sa bugnaw nga mga bowl nga may garnish. Iwisik og feta.',notes:''}},{id:16,emoji:'🌽',category:'salades',tags:['vege','healthy'],author:'Meghan Saito',photo:null,servings:'6',prepTime:'',cookTime:'5 min',totalTime:'',bapRating:'',leahRating:'',fr:{title:'Salade Estivale au Couscous',difficulty:'',ingredients:['1¼ tasse de bouillon de légumes','1 tasse couscous complet','1 càc cumin','1 càc coriandre','Jus d\'1 citron','1 càs miel','3 càs huile d\'olive','2 tasses roquette ou épinards','1 boîte pois chiches','1 tasse maïs','1 tasse myrtilles','2 nectarines ou pêches en dés','1 concombre en dés','1 avocat en dés','½ tasse graines de courge','¼ oignon rouge','Herbes fraîches'],directions:'Porter le bouillon à ébullition. Ajouter le couscous et les épices. Couvrir 5 min. Étaler pour refroidir.\nFouetter jus de citron, miel, huile, sel et poivre dans un grand bol. Ajouter tous les autres ingrédients. Incorporer le couscous refroidi.\nServir frais.',notes:''},en:{title:'Summer Couscous Salad',difficulty:'',ingredients:['1¼ cups vegetable stock','1 cup whole-wheat couscous','1 tsp cumin','1 tsp coriander','Juice of 1 lemon','1 tbsp honey','3 tbsp olive oil','2 cups rocket or spinach','1 can chickpeas','1 cup corn kernels','1 cup blueberries','2 nectarines or peaches, diced','1 cucumber, diced','1 avocado, diced','½ cup pumpkin seeds','¼ red onion','Fresh herbs'],directions:'Bring stock to a boil. Add couscous and spices. Cover 5 min. Spread to cool.\nWhisk lemon juice, honey, oil, salt and pepper in a large bowl. Add all other ingredients. Stir in cooled couscous.\nServe chilled.',notes:''},vi:{title:'Ensalada sa Ting-init nga adunay Couscous',difficulty:'',ingredients:['1¼ tasa vegetable stock','1 tasa whole-wheat couscous','1 kutsarita cumin','1 kutsarita coriander','Katas sa 1 limon','1 kutsara dugos','3 kutsara lana sa olibo','2 tasa rocket o spinaka','1 lata chickpeas','1 tasa mais','1 tasa blueberries','2 nectarine o piritsa, diced','1 pipino, diced','1 avocado, diced','½ tasa pumpkin seeds','¼ pula nga sibuyas','Mga presko nga dahon'],directions:'Pakuloa ang stock. Idugang ang couscous ug mga espesya. Tabunan og 5 minuto. Ipabugnaw sa nagbulagbulag.\nPisaka ang katas sa limon, dugos, lana, asin ug paminta sa usa ka dako nga bowl. Idugang ang tanan nga ubang sangkap. Ihalo ang bugnaw nga couscous.\nIhatag nga presko.',notes:''}},{id:17,emoji:'🥣',category:'salades',tags:['vege','healthy'],author:'Thomas Staub & Dr Jiří Dvořák',photo:null,servings:'4',prepTime:'',cookTime:'30 min',totalTime:'',bapRating:'',leahRating:'',fr:{title:'Veggie Bowl',difficulty:'',ingredients:['300 g carottes','160 g persil-racine','240 g céleri-rave','280 g pommes de terre','8 g romarin','20 g huile de tournesol','PESTO : 8 g persil, 40 g jus de citron, zeste, 40 g huile d\'olive, 8 g sel, 195 g feta'],directions:'Mixer tous les ingrédients du pesto ensemble.\nRôtir les légumes (sauf pommes de terre) avec huile et sel à 230°C jusqu\'à ce qu\'ils restent fermes. Refroidir.\nCuire les pommes de terre en cubes marinés (huile, romarin, sel) à 180°C 20 min. Refroidir.\nMélanger légumes, pommes de terre et pesto. Dresser la feta marinée dans l\'huile sur le dessus.',notes:''},en:{title:'Veggie Bowl',difficulty:'',ingredients:['300 g carrots','160 g parsley root','240 g celeriac','280 g potatoes','8 g rosemary','20 g sunflower oil','PESTO: 8 g parsley, 40 g lemon juice, zest, 40 g olive oil, 8 g salt, 195 g feta'],directions:'Blend all pesto ingredients together.\nRoast vegetables (except potatoes) with oil and salt at 230°C until firm. Cool.\nCook cubed potatoes marinated in oil, rosemary and salt at 180°C for 20 min. Cool.\nCombine vegetables, potatoes and pesto. Top with feta marinated in olive oil.',notes:''},vi:{title:'Utan nga Bowl',difficulty:'',ingredients:['300 g karot','160 g parsley root','240 g celeriac','280 g patatas','8 g rosemary','20 g sunflower oil','PESTO: 8 g parsley, 40 g katas sa limon, zest, 40 g olive oil, 8 g asin, 195 g feta'],directions:'Ibungkag ang tanan nga sangkap sa pesto.\nI-roast ang mga gulay (gawas ang patatas) nga may lana ug asin sa 230°C hangtod lig-on pa. Pabugnawa.\nLutua ang patatas nga cubo nga gi-marinate sa lana, rosemary ug asin sa 180°C og 20 minuto. Pabugnawa.\nIhalo ang mga gulay, patatas ug pesto. Butangan og feta nga gi-marinate sa lana sa ibabaw.',notes:''}},{id:18,emoji:'🍳',category:'plats',tags:['vege','healthy','rapide'],author:'',photo:null,servings:'2-3',prepTime:'5 min',cookTime:'20 min',totalTime:'25 min',bapRating:'',leahRating:'',fr:{title:'Shakshuka',difficulty:'Facile',ingredients:['2 càs huile d\'olive','1 oignon émincé','1 poivron rouge en dés','3 gousses d\'ail émincées','1 càc cumin','1 càc paprika fumé','½ càc piment de Cayenne','1 boîte de tomates concassées (400 g)','4-6 œufs','Sel et poivre','Persil frais ou coriandre','Pain pita pour servir','Optionnel : feta émiettée'],directions:'Chauffer l\'huile dans une grande poêle. Faire revenir l\'oignon 5 min. Ajouter le poivron, cuire 3 min.\nAjouter l\'ail, le cumin, le paprika et le piment. Cuire 1 min.\nAjouter les tomates. Saler, poivrer. Mijoter à feu doux 8-10 min.\nFaire des puits dans la sauce. Casser un œuf dans chaque puits. Couvrir et cuire 5-8 min selon la texture souhaitée.\nParsemer de persil ou de feta. Servir avec du pain.',notes:'Parfait pour un brunch rapide ou un dîner végétarien. Se prépare à l\'avance jusqu\'à l\'étape 3.'},en:{title:'Shakshuka',difficulty:'Easy',ingredients:['2 tbsp olive oil','1 sliced onion','1 red pepper, diced','3 garlic cloves, minced','1 tsp cumin','1 tsp smoked paprika','½ tsp cayenne pepper','1 can crushed tomatoes (400 g)','4-6 eggs','Salt and pepper','Fresh parsley or coriander','Pita bread to serve','Optional: crumbled feta'],directions:'Heat oil in a large pan. Sauté onion 5 min. Add pepper, cook 3 min.\nAdd garlic, cumin, paprika and cayenne. Cook 1 min.\nAdd tomatoes. Season. Simmer on low heat 8-10 min.\nMake wells in the sauce. Crack an egg into each well. Cover and cook 5-8 min to your liking.\nScatter parsley or feta. Serve with bread.',notes:'Perfect for a quick brunch or vegetarian dinner. Can be made ahead up to step 3.'},vi:{title:'Shakshuka',difficulty:'Sayon',ingredients:['2 kutsara lana sa olibo','1 sibuyas, gilabha','1 pula nga sili, diced','3 ulo bawang, ginitis','1 kutsarita cumin','1 kutsarita smoked paprika','½ kutsarita cayenne pepper','1 lata pinadurog nga kamatis (400 g)','4-6 itlog','Asin ug paminta','Presko nga parsley o coriander','Pita bread','Opsyonal: gibuak nga feta'],directions:'Painita ang lana sa dako nga kawali. Igisa ang sibuyas og 5 minuto. Idugang ang sili, lutua og 3 minuto.\nIdugang ang bawang, cumin, paprika ug cayenne. Lutua og 1 minuto.\nIdugang ang kamatis. Timplahan. Paligad sa mahinay nga apoy og 8-10 minuto.\nBuhata ang mga buho sa sarsa. Basaga ang usa ka itlog sa matag buho. Tabunan ug lutua og 5-8 minuto.\nIwisik og parsley o feta. Ihatag nga may tinapay.',notes:'Perpekto alang sa dali nga brunch o vegetarianong panihapon. Mapahimo daan hangtod sa ika-3 nga lakang.'}},{id:19,emoji:'🍣',category:'plats',tags:['healthy','rapide'],author:'',photo:null,servings:'2',prepTime:'10 min',cookTime:'12 min',totalTime:'22 min',bapRating:'',leahRating:'',fr:{title:'Saumon Teriyaki Maison',difficulty:'Facile',ingredients:['2 pavés de saumon','3 càs sauce soja','1 càs mirin (ou 1 càs vinaigre de riz + ½ càc sucre)','1 càs miel','1 càc gingembre frais râpé','1 gousse d\'ail émincée','1 càs huile neutre','Graines de sésame','Ciboulette ou oignon vert','Riz japonais pour servir'],directions:'Mélanger sauce soja, mirin, miel, gingembre et ail dans un bol. C\'est la sauce teriyaki.\nMariner les pavés de saumon 5-10 min.\nChauffer l\'huile dans une poêle à feu moyen-vif. Saisir le saumon côté peau 4 min, retourner 3 min. Retirer le saumon.\nVerser la marinade dans la poêle. Réduire 2 min à feu vif jusqu\'à consistance sirupeuse.\nNapper le saumon. Parsemer de sésame et ciboulette. Servir sur riz.',notes:'Le saumon peut aussi se cuire au four : 15 min à 200°C. Pour une version plus légère, remplacer le miel par du sirop d\'agave.'},en:{title:'Homemade Salmon Teriyaki',difficulty:'Easy',ingredients:['2 salmon fillets','3 tbsp soy sauce','1 tbsp mirin (or 1 tbsp rice vinegar + ½ tsp sugar)','1 tbsp honey','1 tsp fresh grated ginger','1 garlic clove, minced','1 tbsp neutral oil','Sesame seeds','Chives or spring onion','Japanese rice to serve'],directions:'Mix soy sauce, mirin, honey, ginger and garlic in a bowl. That\'s your teriyaki sauce.\nMarinate the salmon fillets for 5-10 min.\nHeat oil in a pan over medium-high heat. Sear salmon skin-side down 4 min, flip and cook 3 min. Remove salmon.\nPour marinade into pan. Reduce 2 min over high heat until syrupy.\nGlaze the salmon. Sprinkle sesame and chives. Serve over rice.',notes:'Can also be baked in the oven at 200°C for 15 min. For a lighter version, replace honey with agave syrup.'},vi:{title:'Teriyaki Salmon',difficulty:'Sayon',ingredients:['2 piraso nga salmon','3 kutsara toyo','1 kutsara mirin','1 kutsara dugos','1 kutsarita gibuak nga luya','1 ulo bawang, ginitis','1 kutsara neutral nga lana','Liso sa sesame','Chives o spring onion','Japanese rice alang sa pagserbisyo'],directions:'Ihalo ang toyo, mirin, dugos, luya ug bawang sa usa ka bowl. Mao na ang teriyaki sauce.\nI-marinate ang salmon og 5-10 minuto.\nPainita ang lana sa kawali sa medium-high nga apoy. Iprito ang salmon (anit paubos) og 4 minuto, liso ug lutua og 3 minuto. Kuhaa ang salmon.\nIbubo ang marinade sa kawali. Ubsan og 2 minuto sa mainiton nga apoy hangtod mahimong sirup.\nSalapin ang salmon. Iwisik og sesame ug chives. Ihatag sa bugas.',notes:'Mahimo usab i-bake sa hurno sa 200°C og 15 minuto. Para sa mas gaan, ilisi ang dugos og agave syrup.'}},{id:20,emoji:'🫘',category:'plats',tags:['vege','healthy'],author:'',photo:null,servings:'4',prepTime:'10 min',cookTime:'25 min',totalTime:'35 min',bapRating:'',leahRating:'',fr:{title:'Dal de Lentilles Corail au Lait de Coco',difficulty:'Facile',ingredients:['250 g lentilles corail rincées','1 boîte lait de coco (400 ml)','400 ml bouillon de légumes','1 oignon émincé','3 gousses d\'ail','1 càc gingembre frais râpé','1 càc curcuma','1 càs garam masala','1 càc cumin','½ càc piment doux','1 boîte tomates concassées (400 g)','2 càs huile de coco','Sel','Coriandre fraîche','Jus de ½ citron','Riz basmati ou pain naan pour servir'],directions:'Chauffer l\'huile. Faire dorer l\'oignon 5 min. Ajouter ail et gingembre, cuire 1 min.\nAjouter toutes les épices. Faire revenir 30 sec.\nAjouter les tomates, les lentilles, le bouillon et le lait de coco. Porter à ébullition.\nMijoter 20-25 min à découvert jusqu\'à ce que les lentilles soient tendres. Presser le citron, ajuster le sel.\nGarnir de coriandre fraîche. Servir avec du riz basmati.',notes:'Se conserve 3-4 jours et se congèle très bien. Encore meilleur le lendemain !'},en:{title:'Red Lentil Dal with Coconut Milk',difficulty:'Easy',ingredients:['250 g red lentils, rinsed','1 can coconut milk (400 ml)','400 ml vegetable stock','1 sliced onion','3 garlic cloves','1 tsp fresh grated ginger','1 tsp turmeric','1 tbsp garam masala','1 tsp cumin','½ tsp mild chilli','1 can crushed tomatoes (400 g)','2 tbsp coconut oil','Salt','Fresh coriander','Juice of ½ lemon','Basmati rice or naan to serve'],di
