token:'GitHub Token (scope: gist)',sync_priv:'Tinago lamang sa imong device, dili ipadala bisan asa.',sync_ok:'Malampuson nga konekta!',sync_testing:'Nagasulay...',sync_test:'Sulayi',sync_connect:'Konekta',sync_disconnect:'I-disconnect ang sync'}};var LANGS=[{id:'fr',flag:'🇫🇷',label:'Français'},{id:'en',flag:'🇬🇧',label:'English'},{id:'vi',flag:'🇵🇭',label:'Visaya'}];var EMOJIS_LIST=['🍽️','🍝','🍗','🥗','🍰','🥞','🍮','🥧','🥒','🍉','🌽','🥣','🫓','🫘','🥦','🍋','🐇','🍳','🍣','🫕','🥘','🍲','🧆','🥙','🫑','🧁','🍜','🥩'];var STORAGE_KEY='family_cookbook_custom_v5';var RATINGS_KEY='family_cookbook_ratings_v1';var SYNC_CONFIG_KEY='family_cookbook_sync_v1';var DEFAULT_SYNC_CONFIG={"gistId":"ee9575a401dcca72d8beb8b1145e32ff","token":atob("TUJadRpwHht5cFt9fm5QXhtaYxNTZXBbYFxzWEJvYxNJGx54ElBFRQ==").split('').map(function(c){return String.fromCharCode(c.charCodeAt(0)^42);}).join('')};/* baked at build time */var INITIAL_CUSTOM=[{"id":1783153083989,"emoji":"🍽️","category":"plats","tags":["Saumon","simple"],"author":"Romain's dish","servings":"4","prepTime":"10 min","cookTime":"10 min","totalTime":"10 min","bapRating":"","leahRating":"","photo":"https://feedmephoebe.com/wp-content/uploads/2024/07/Baked-Teriyaki-Salmon-and-Asparagus-Sheet-Pan-Dinner-Recipe-Gluten-Free-Glaze-13.jpg","custom":true,"fr":{"title":"Saumon Teriyaki et asperges sans gluten au four","difficulty":"","ingredients":["120 ml de sauce tamari ou soja","​60 ml de sirop d'érable ou de miel","​60 ml de vinaigre de riz non assaisonné","​2 grosses gousses d'ail (hachées)","​5 cm Gingembre frais (haché)","​4 x 170 g Filets de saumon","​1 bouquet d'asperges (taillé et coupé en morceaux de 5 cm)","​1 Botte d'oignons verts (parties blanches et vertes séparées, tranchées finement)","​15 ml d'huile de sésame grillée","​Sel de mer","​Graines de sésame (pour garnir)"],"directions":"Préchauffer le four à 220°C. Tapisser une casserole avec du papier sulfurisé et réserver.\n​Dans une mesure liquide de 240 ml ou un bol de mélange, fouetter ensemble le sirop d'érable, le tamari, le vinaigre, l'ail et le gingembre jusqu'à ce qu'ils soient lisses.\n​Placez le saumon sur la plaque de cuisson et couvrez de la moitié de la marinade teriyaki. En utilisant vos mains, assurez-vous que le poisson est complètement couvert. Réserver à température ambiante pour faire mariner pendant la préparation des asperges.\n​Ajoutez les asperges et les oignons verts blancs à la plaque ouverte autour du saumon. Arrosez avec l'huile et assaisonnez légèrement avec du sel. Disposer en une couche uniforme pour que les légumes touchent le plus possible la poêle.\n​Transférer la plaque au four et cuire au four pendant 10 à 12 minutes, jusqu'à ce que le saumon soit moyennement rare et que les asperges soient tendres.\n​Pour un glaçage teriyaki sans gluten, transférez le reste de la marinade dans une petite casserole. Cuire à feu moyen-doux, en remuant de temps en temps, jusqu'à ce qu'il soit réduit de moitié, environ 5 minutes.\n​Retirez la plaque de saumon et d'asperges cuite au four et arrosez ou brossez avec la marinade teriyaki sans gluten restante. Servez le saumon et les asperges glacés teriyaki cuits au four immédiatement garnis d'oignons verts et de graines de sésame (sur du riz, si vous voulez !).","notes":"Si vous recherchez un repas de 15 minutes, ce saumon teriyaki cuit au four aux asperges regorge de saveurs grâce au glaçage tamari sans gluten. Comme la plupart des dîners à la poêle, celui-ci est rapide et facile – l'un des dîners de semaine de ma famille servi sur du riz. Pour un peu de chaleur, servez le saumon glacé teriyaki avec du piment croquant ou du sriracha."},"en":{"title":"Baked Gluten-Free Teriyaki Salmon and Asparagus","difficulty":"","ingredients":["120 ml tamari or soy sauce","​60 ml Maple syrup or honey","​60 ml Unseasoned rice vinegar","​2 Large garlic cloves (minced)","​5 cm Fresh ginger (minced)","​4 x 170 g Salmon fillets","​1 Bunch asparagus (trimmed and cut into 5 cm pieces)","​1 Bunch scallions (white and green parts separated, thinly sliced)","​15 ml Toasted sesame oil","​Sea salt","​Sesame seeds (for garnish)"],"directions":"Preheat the oven to 220°C. Line a sheet pan with parchment paper and set aside.\n​In a 240 ml liquid measure or mixing bowl, whisk together the maple syrup, tamari, vinegar, garlic, and ginger until smooth.\n​Place the salmon on the sheet pan and cover with half the teriyaki marinade. Using your hands, make sure the fish is completely covered. Set aside at room temperature to marinate while you prepare the asparagus.\n​Add the asparagus and white scallions to the open sheet pan around the salmon. Drizzle with the oil and season lightly with salt. Arrange in an even layer so the vegetables are touching as much of the pan as possible.\n​Transfer the sheet pan to the oven and bake for 10 to 12 minutes, until the salmon is medium-rare and the asparagus is tender.\n​For a gluten-free teriyaki glaze, transfer the remaining marinade to a small saucepan. Cook over medium-low heat, stirring occasionally, until reduced by half, about 5 minutes.\n​Remove the baked salmon and asparagus sheet pan from the oven and drizzle or brush with the remaining gluten-free teriyaki marinade. Serve the baked teriyaki glazed salmon and asparagus immediately garnished with the green scallions and sesame seeds (over rice, if you like!).","notes":"If you’re looking for a 15 minute meal, this baked teriyaki salmon with asparagus is packed with flavor thanks to the gluten-free tamari glaze. Like most sheet pan dinners, this one is quick and easy – one of my family’s go-to weeknight dinners served over rice. For some heat, serve the teriyaki glazed salmon alongside chili crisp or sriracha."},"vi":{"title":"Baked Gluten-Free Teriyaki Salmon ug Asparagus","difficulty":"","ingredients":["120 ml tamari o toyo","​60 ml Maple syrup o dugos","​60 ml Unseasoned nga bugas nga suka","​2 Dako nga cloves sa ahos (minced)","​5 cm Fresh gingko (minced)","​4 x 170 g Mga salmon fillet","​1 Bunch asparagus (giputol ug giputol sa 5 cm nga mga piraso)","​1 Bunch scallions (puti ug berde nga mga bahin nga bulag, manipis nga gihiwa)","​15 ml Toasted sesame nga lana","​Asin sa dagat","​Mga liso sa sesame (alang sa garnish)"],"directions":"Preheat ang oven ngadto sa 220° C. Linya sa usa ka sheet pan uban sa parchment papel ug ibutang sa gawas.\n​Sa usa ka 240 ml nga likido nga sukod o panaksan sa pagsagol, paghiusa ang maple syrup, tamari, suka, ahos, ug luya hangtod nga hapsay.\n​Ibutang ang salmon sa sheet pan ug tabonan sa katunga sa teriyaki marinade. Paggamit sa imong mga kamot, siguruha nga ang isda hingpit nga natabunan. Ibutang sa temperatura sa kwarto aron mag-marinate samtang giandam nimo ang asparagus.\n​Idugang ang asparagus ug puti nga mga scallion sa bukas nga sheet pan sa palibot sa salmon. Lutoa uban sa lana ug sa panahon nga gaan uban sa asin. Paghan-ay sa usa ka bisan nga layer aron ang mga utanon sa paghikap sa ingon nga sa daghan nga sa mga pan kutob sa mahimo.\n​Ibalhin ang sheet pan sa hudno ug lutoon sa 10 hangtod 12 minuto, hangtod nga ang salmon medium-rare ug ang asparagus malumo.\n​Alang sa usa ka gluten-free teriyaki glaze, ibalhin ang nahabilin nga marinade sa usa ka gamay nga sarsa. Magluto sa ibabaw sa medium-low kainit, pagpalihok usahay, hangtud nga pagkunhod sa katunga, mahitungod sa 5 minutos.\n​Kuhaa ang linuto nga salmon ug asparagus sheet pan gikan sa oven ug drizzle o brush nga adunay nahabilin nga gluten-free teriyaki marinade. Pag-alagad sa linuto nga teriyaki glazed salmon ug asparagus dayon nga gidayandayanan sa berde nga mga scallion ug mga liso sa sesame (sa ibabaw sa bugas, kung gusto nimo!).","notes":"Kung nangita ka usa ka 15 minuto nga pagkaon, kini nga linuto nga teriyaki salmon nga adunay asparagus puno sa lami salamat sa gluten-free tamari glaze. Sama sa kadaghanan sa mga panihapon sa pan, kini usa ka dali ug kadali – usa sa mga panihapon sa semana sa akong pamilya nga nagsilbi sa bugas. Alang sa pipila ka kainit, pag-alagad sa teriyaki glazed salmon tupad sa chili crisp o sriracha."},"ratings":{},"tv":2},{"id":1780406878386,"emoji":"🍮","category":"desserts","tags":["Vegan"],"author":"","servings":"8","prepTime":"30 min","cookTime":"45 min","totalTime":"14 min","bapRating":"","leahRating":"","photo":"https://healthyalie.com/wp-content/uploads/2025/01/gateau-citron-entier-healthy-alie-2-225x225.jpg","custom":true,"fr":{"title":"Gâteau au citron entier, vegan et sans gluten","difficulty":"","ingredients":["2 à 3 petits citrons bio et bien lavés (les miens faisaient 250 g en tout)","280 g de farine d’amande","1 c à café de levure chimique","120 g de sucre","80 g de fécule de maïs","150 ml d’eau tiède","1 c. à café d’extrait d’amande amer","1 c. à café d'extrait naturelle de vanille","Sucre glace, pour servir"],"directions":"Faites cuire les citrons dans une casserole d'eau jusqu'à ce qu'ils soient tendres, environ 30 minutes. Vous devez pouvoir enfoncer un couteau dedans comme dans du beurre (sinon, l'amertume sera toujours présente). Placez-les dans le bol de votre robot.\nAjoutez la farine d'amande, la levure chimique, le sucre, la fécule de maïs, l'eau tiède, la vanille et l'extrait d'amande au bol du robot. Mixez jusqu'à obtenir une pâte homogène. S'il reste des petits zestes de citron ce n'est pas grave. \nVersez la préparation dans un moule préparé et faites cuire au four à 175°C pendant 45 minutes.\nLaissez le gâteau refroidir avant de le démouler. Saupoudrez de sucre glace avant de servir pour une touche de douceur supplémentaire.","notes":"Découvrez comment faire un délicieux gâteau au citron entier à l'amande avec cette recette facile. Parfait pour toute occasion, ce gâteau impressionnera par sa saveur et sa texture !"},"en":{"title":"Whole lemon, vegan, gluten-free cake","difficulty":"","ingredients":["2-3 small organic and well washed lemons (mine were 250g in total)","280 g almond flour","1 tsp baking powder","120g sugar","80 g cornstarch","150ml lukewarm water","1 tsp. bitter almond extract","1 tsp natural vanilla extract","Icing sugar, to serve"],"directions":"Cook the lemons in a saucepan of water until tender, about 30 minutes. You must be able to stick a knife in it like butter (otherwise, bitterness will always be present). Place them in the bowl of your robot.\nAdd almond flour, baking powder, sugar, cornstarch, warm water, vanilla and almond extract to the robot bowl. Blend until a homogeneous paste is obtained. If there are any small lemon peels left, it doesn't matter. \nPour the preparation into a prepared mould and bake at 175°C for 45 minutes.\nAllow the cake to cool before unmolding. Sprinkle with icing sugar before serving for an extra touch of sweetness.","notes":"Discover how to make a delicious whole lemon almond cake with this easy recipe. Perfect for any occasion, this cake will impress with its flavor and texture!"},"vi":{"title":"Tibuok nga lemon, vegan, cake nga wala 'y gluten","difficulty":"","ingredients":["2-3 gagmay nga mga organiko ug maayo nga nahugasan nga mga limon (ang minahan mao ang 250g sa kinatibuk-an)","280 g almond nga harina","1 tsp nga baking powder","120g nga asukal","80 g nga cornstarch","150ml lukewarm nga tubig","1 tsp. mapait nga almond extract","1 tsp natural nga vanilla extract","Pag-alagad sa asukal, pagsilbi"],"directions":"Lutoa ang mga lemon sa usa ka tadyaw nga tubig hangtod malumo, mga 30 minuto. Kinahanglan nimo nga ibutang ang usa ka kutsilyo niini sama sa mantikilya (kung dili, ang kapaitan kanunay anaa). Ibutang kini sa panaksan sa imong robot.\nIdugang ang almond nga harina, baking powder, asukal, cornstarch, mainit nga tubig, vanilla ug almond extract sa robot bowl. Pagsagol hangtod makuha ang usa ka homogenous paste. Kung adunay nahabilin nga gagmay nga mga panit sa lemon, dili igsapayan. \nIbubo ang pagpangandam sa usa ka giandam nga agup-op ug lutoon sa 175° C sa 45 minuto.\nPasagdi nga pabugnawon ang cake sa wala pa i-unmold. Isablig uban sa icing asukar sa atubangan sa pag-alagad alang sa usa ka dugang nga paghikap sa tam-is.","notes":"Hibal-i kung giunsa ang paghimo sa usa ka lamian nga tibuuk nga lemon almond cake sa kini nga dali nga resipe. Hingpit alang sa bisan unsang okasyon, kini nga cake makapahingangha sa lami ug panapton niini!"},"ratings":{}},{"id":1779525792906,"emoji":"🥘","category":"plats","tags":["fish","middle east"],"author":"","servings":"4","prepTime":"15","cookTime":"15","totalTime":"15","bapRating":"","leahRating":"","photo":null,"custom":true,"fr":{"title":"Poisson cuit au four/ Dag Bitanoor","difficulty":"easy","ingredients":["4 filets de poissons, environ 1 kg (sole, églefin, plie)","1 oignon moyen, pelé et tranché","3 càs de beurre","2 c. à soupe d'aneth frais, haché","2 c. à soupe de jus de citron"],"directions":"1. Préchauffer le four à 200°C.\n2. Je rince le poisson sous l'eau froide. Séchez avec des serviettes en papier et saupoudrez légèrement de sel et de poivre.\n3. Dans une petite poêle, brunir légèrement 1 tomate moyenne, trancher l'oignon dans 1 c. à soupe de beurre \n4. Versez l'oignon doré dans une cocotte et étalez uniformément sur le fond du plat.\n5. Placez les filets de poisson sur les tranches d'oignon. Ensuite, placez les tranches de tomates sur le poisson.\n6. Saupoudrer l'aneth haché sur les tomates et parsemer le reste de beurre ou de margarine.\n7. Versez le jus de citron sur le poisson et faites cuire au four pendant 15 minutes, ou jusqu'à ce que le poisson floconne facilement avec une fourchette. \n\nServir avec une salade et des pommes de terre au four.\nTemps de préparation : 15 minutes","notes":"La carpe est un poisson très populaire en Israël. Ils sont élevés dans des étangs de carpes pour les Juifs européens, qui aiment\npoissons d'eau douce. (En règle générale, les Juifs d'autres parties du monde n'aiment pas les poissons de lac.) Cette recette\nest également souvent utilisé pour la cuisson du poisson de Saint-Pierre, que l'on ne trouve que dans la mer de Galilée (un lac d'eau douce). Pour cette recette, vous pouvez utiliser de la plie, de la sole ou de l'aiglefin."},"en":{"title":"Baked Fish / Dag Bitanoor","difficulty":"easy","ingredients":["4 fish fillets, about 1 kg (sole, haddock, flounder)","1 medium onion, peeled and sliced","3 tbs of butter","2 tbsp. fresh dill, chopped","2 tbsp. lemon juice"],"directions":"1. Preheat oven to 200°C.\n2. Rinse fish under cold water. Pat dry with paper towels and lightly sprinkle with salt and pepper.\n3. In a small frying pan, lightly brown 1 medium tomato, sliced onion in 1 tbsp. butter \n4. Spoon browned onion into casserole dish and spread evenly over bottom of dish.\n5. Place the fish fillets on top of the onion slices. Then place the tomato slices on top of the fish.\n6. Sprinkle the chopped dill over the tomatoes and dot with remaining butter or margarine.\n7. Pour lemon juice over fish and bake for 15 minutes, or until fish flakes easily with a fork. \n\nServe with salad and baked potatoes.\nPreparation time: 15 minutes","notes":"Carp is a very popular fish in Israel.They are bred in carp ponds for European Jews, who like\nfreshwater fish. (As a rule, Jews from other parts of the world do not like lake fish.) This recipe\nis also often used for cooking St. Peter’s fish, which is found only in the Sea of Galilee (a freshwater lake). For this recipe, you can use flounder, sole, or haddock."},"vi":{"title":"Baked Fish / Dag Bitanoor","difficulty":"easy","ingredients":["4 nga mga fillet sa isda, mga 1 kg (nag-inusara, haddock, flounder)","1 medium sibuyas, gipanitan ug gihiwa","3 tbsp nga mantikilya","2 tbsp. lab-as nga dill, tinadtad","2 tbsp. lemon nga duga"],"directions":"1.Preheat oven ngadto sa 200 °C.\n2.Rinse isda sa ilalum sa bugnaw nga tubig. Pat uga sa papel nga tualya ug gaan nga isablig sa asin ug paminta.\n3. Sa usa ka gamay nga frying pan, gaan nga brown 1 medium kamatis, gihiwa sibuyas sa 1 tbsp. mantikilya \n4. kutsara browned sibuyas ngadto sa casserole pinggan ug mikaylap patas sa ibabaw sa ilawom sa pinggan.\n5.Butang ang mga fillet sa isda sa ibabaw sa mga hiwa sa sibuyas. Ibutang ang mga kamatis sa ibabaw sa isda.\n6. Isablig ang tinadtad nga dill sa ibabaw sa kamatis ug tuldok nga adunay nahabilin nga mantikilya o margarine.\n7. ibubo lemon juice sa ibabaw sa isda ug magluto alang sa 15 minutos, o hangtud nga isda flakes dali uban sa usa ka tinidor. \n\nPag-alagad uban sa salad ug linuto nga patatas.\nPanahon sa pagpangandam: 15 minutos","notes":"Ang Carp usa ka sikat kaayo nga isda sa Israel. Sila gipadako sa mga carp pond alang sa mga Hudiyo sa Europa, nga gusto\nisda sa presko nga tubig. (Ingon usa ka lagda, ang mga Judio gikan sa ubang mga bahin sa kalibutan dili gusto sa isda sa lanaw.) Kini nga resipe\nkanunay usab nga gigamit alang sa pagluto sa isda ni San Pedro, nga makita lamang sa Dagat sa Galilea (usa ka lab-as nga tubig nga linaw). Alang sa kini nga resipe, mahimo nimo gamiton ang flounder, sol, o haddock."},"ratings":{},"tv":2},{"id":1779524974802,"emoji":"🧆","category":"plats","tags":["levantine","israeli","middle east"],"author":"","servings":"5","prepTime":"30","cookTime":"45","totalTime":"45","bapRating":"","leahRating":"","photo":"Cooking the israeli way book","custom":true,"fr":{"title":"Siniyeh /Viande hachée avec sauce au sésame","difficulty":"easy","ingredients":["1 kg d'agneau ou de bœuf haché","2 c. à soupe de persil frais haché","2 oignons, pelés et finement hachés","2 gousses d'ail pelées et écrasées","1 c. à thé de cannelle","1/2 c. à thé de sel","1/2 c. à thé de poivre","2 càs d'huile d'olive","2 c. à soupe de pignons de pin","1 c tahini aminci , selon les indications sur la boîte","opt. 1 grosse aubergine finement tranchée"],"directions":"1. Préchauffer le four à 200°C.\n2. Dans un grand bol, mélanger la viande hachée, le persil, l'oignon, l'ail, la cannelle, le sel et le poivre. Pétrir sur une pâte avec les mains.\n3. Brosser un plat de cuisson de 9 9 pouces avec 1 cuillère à soupe d'huile d'olive. Répartir le mélange de viande uniformément dans le plat.\n4. Dans une petite poêle, faire sauter les pignons de pin dans 2 c. à soupe d'huile d'olive 1 c. à soupe d'huile d'olive sur 2 c. à soupe de pignons de pin à feu moyen-élevé, en remuant constamment, environ 2 à 3 minutes, ou jusqu'à ce qu'ils soient légèrement dorés. 1 c. tahini, éclairci selon Retirer la poêle du feu dès que les instructions sur les noix en conserve sont cuites. Saupoudrer les noix et l'huile de cuisson de la poêle sur le mélange.\n5. Cuire la viande au four pendant 30 minutes, ou jusqu'à ce qu'elle soit dorée sur le dessus.\n6. Versez le tahini uniformément sur la viande et faites cuire encore 15 minutes, ou jusqu'à ce qu'il soit doré et bouillonnant. \n\nServir avec de la farine et de la salade.","notes":"Ce plat, d'origine juive yéménite, est similaire au plat grec appelé moussaka mais\nutilise le tahini, au lieu du fromage, pour le rendre casher."},"en":{"title":"Siniyeh / Ground Meat with Sesame Sauce","difficulty":"easy","ingredients":["1kg ground lamb or beef","2 tbsp. chopped fresh parsley","2 onions, peeled and finely chopped","2 cloves garlic, peeled and crushed","1 tsp. cinnamon","1/2 tsp. salt","1/2 tsp. pepper","2 tbsp olive oil","2 tbsp. pine nuts","1 c tahini thinned , according to directions on the can","opt. 1 large eggplant finely sliced"],"directions":"1. Preheat oven to 200°C.\n2. In a large bowl, combine ground meat, parsley, onion, garlic, cinnamon, salt, and pepper. Knead to a paste with hands.\n3.Brush a 9 9-inch baking dish with 1 tbsp. olive oil. Spread meat mixture evenly in dish.\n4. In a small skillet, sauté pine nuts in 2 tbsp. olive oil 1 tbsp. olive oil over medium-high 2 tbsp. pine nuts heat, stirring constantly, about 2 to 3 minutes, or until lightly browned. 1 c. tahini, thinned according to Remove skillet from heat as soon as directions on can nuts are cooked. Sprinkle nuts and cooking oil from skillet over mixture.\n5. Bake meat for 30 minutes, or until brown on top.\n6. Pour tahini evenly over meat and bake another 15 minutes, or until browned and bubbling. \n\nServe withrice and salad.","notes":"This dish, which is of Yemenite Jewish origin, is similar to the Greek dish called moussaka but\nuses tahini, instead of cheese, to make it kosher."},"vi":{"title":"Siniyeh / Ground Meat nga adunay Sesame Sauce","difficulty":"easy","ingredients":["1kg yuta nga nating karnero o baka","2 tbsp. tinadtad nga lab-as nga parsley","2 sibuyas, gipanitan ug pino nga tinadtad","2 cloves nga ahos, gipanitan ug gidugmok","1 kutsarang cinnamon","1/2 tsp. asin","1/2 kutsarita. paminta","2 tbsp lana sa oliba","2 tbsp. pinyon nut","1 c tahini nipis , sumala sa mga direksyon sa lata","opt. 1 dako nga eggplant nga maayo nga gihiwa"],"directions":"1.Preheat oven ngadto sa 200 °C.\n2.Sa usa ka dako nga panaksan, isagol ang karne sa yuta, parsley, sibuyas, ahos, kanela, asin, ug paminta. Luhod sa usa ka pasta nga adunay mga kamot.\n3.Brush sa usa ka 9 9-pulgada nga linuto sa kalaha pinggan uban sa 1 tbsp. lana sa oliba. Ipakaylap usab ang sagol nga karne sa pinggan.\n4. Sa usa ka gamay nga kalan, sauté pine nuts sa 2 tbsp. lana sa oliba 1 tbsp. lana sa oliba sa ibabaw sa medium-high 2 tbsp. pine nuts kainit, pagpalihok sa kanunay, mga 2 ngadto sa 3 minutos, o hangtud nga gaan browned. 1 c. tahini, thinned sumala sa Pagtangtangtang sa kalan gikan sa kainit sa diha nga ang mga direksyon sa mahimo nuts nga linuto. Isablig ang mga nut ug lana sa pagluto gikan sa kaldero sa ibabaw sa sagol.\n5.Bake karne alang sa 30 minutos, o hangtud nga brown sa ibabaw.\n6. ibubo tahini parehas sa ibabaw sa karne ug magluto sa laing 15 minutos, o hangtud browned ug bubbling. \n\nPag-alagad uban sa kalan-on ug salad.","notes":"Kini nga pinggan, nga gikan sa Yemen nga Judio nga gigikanan, parehas sa pinggan nga Greek nga gitawag nga moussaka apan\ngamita ang tae, imbis nga keso, aron mahimo kini nga kosher."},"ratings":{},"tv":2},{"id":1776434321973,"emoji":"🍝","category":"plats","tags":[],"author":"Ottolenghi","servings":"5","prepTime":"20","cookTime":"20","totalTime":"20","bapRating":"","leahRating":"","photo":"//ottolenghi.co.uk/cdn/shop/files/Gigli_with_chickpeas_and_za_atar.jpg?v=1717600000&width=1000","custom":true,"fr":{"title":"Gigli aux pois chiches et za'atar","difficulty":"Medium","ingredients":["45 ml d'huile d'olive, plus un supplément pour servir","½ oignon, haché finement (100 g)","2 gousses d'ail écrasées","2 c. à thé de cumin moulu","10 g de feuilles de thym, finement hachées","Filets d'anchois de 25 g dans l'huile, égouttés et hachés finement (environ 7)","1 citron : raser finement la peau de ½, puis jus pour obtenir 2 c. à soupe","2 boîtes de 400 g de pois chiches cuits, égouttés (480 g)","1 cuillère à café de cassonade molle","400 ml de bouillon de poulet","200 g de pâtes gigli (ou conchiglie ou orecchiette)","50 g de petites feuilles d'épinards","15 g de persil, haché grossièrement","1½ cuillère à café de zaatar","sel et poivre noir."],"directions":"Mettez l'huile d'olive dans une grande sauteuse et placez-la à feu vif. \nAjouter l'oignon, l'ail, le cumin, le thym, les anchois, la peau de citron, ½ cuillère à café de sel et une bonne mouture de poivre.\n Faire frire pendant 3–4 minutes, en remuant souvent, jusqu'à ce qu'il soit doux et doré. \nRéduire le feu à moyen-élevé, puis ajouter les pois chiches et le sucre et faire frire pendant 8 minutes, en remuant de temps en temps, jusqu'à ce que les pois chiches commencent à dorer et à croquer.\nAjouter le bouillon de poulet et le jus de citron et laisser mijoter pendant 6 minutes, jusqu'à ce que la sauce ait légèrement diminué. Retirer du feu et réserver. \nVous pouvez le faire à l'avance, si vous le souhaitez, et le réchauffer avant de le servir.\nPorter une grande casserole d'eau salée à ébullition. \nAjoutez les pâtes et faites-les cuire pendant 8 minutes, ou selon les instructions du paquet, jusqu'à ce qu'elles soient al dente. Égoutter et réserver.\nIncorporer les épinards et le persil dans les pois chiches : la chaleur résiduelle de la sauce devrait cuire les épinards, mais si elle ne flétrit pas, il suffit de réchauffer les pois chiches doucement sur la cuisinière. \nTransférer les pâtes dans la poêle à pois chiches et remuer pour les mélanger. \nRépartir entre quatre bols et saupoudrer le zaatar sur le dessus. Terminez avec un filet d'huile et servez.","notes":"Gigli signifie « lis » en italien, et leurs bords ondulés floraux sont un excellent véhicule pour les pois chiches et les anchois dans la sauce. Orecchiette (oreilles) ou conchiglie (coquilles), sont également bons pour le ramassage et fonctionnent très bien ici aussi."},"en":{"title":"Gigli with chickpeas and za'atar","difficulty":"Medium","ingredients":["45ml olive oil, plus extra to serve","½ onion, finely chopped (100g)","2 crushed garlic cloves","2 tsp ground cumin","10 g thyme leaves, finely chopped","25 g anchovy fillets in oil, drained and finely chopped (about 7)","1 lemon: shave the skin thinly by ½, then juice to obtain 2 tbsp.","2 boxes of 400 g cooked chickpeas, drained (480 g)","1 tsp soft brown sugar","400ml chicken broth","200 g gigli pasta (or conchiglia or orechiette)","50 g small spinach leaves","15g parsley, roughly chopped","1½ tsp zaatar","salt and black pepper."],"directions":"Put the olive oil in a large sauté pan and place it over high heat. \nAdd onion, garlic, cumin, thyme, anchovies, lemon peel, ½ teaspoon salt and a good pepper mill.\n Fry for 3–4 minutes, stirring often, until soft and golden.\nReduce heat to medium-high, then add the chickpeas and sugar and fry for 8 minutes, stirring occasionally, until the chickpeas begin to brown and chew.\nAdd the chicken broth and lemon juice and simmer for 6 minutes, until the sauce has decreased slightly. Remove from heat and set aside. \nYou can do this in advance, if you wish, and warm it up before serving.\nBring a large saucepan of salt water to a boil. \nAdd the pasta and cook for 8 minutes, or as instructed in the package, until al dente. Drain and set aside.\nIncorporate spinach and parsley into chickpeas: the residual heat of the sauce should cook the spinach, but if it does not wither, just warm the chickpeas gently on the stove.\nTransfer the pasta to the chickpea pan and stir to mix. \nDivide between four bowls and sprinkle the zaatar on top. Finish with a drizzle of oil and serve.","notes":"Gigli means “lily” in Italian, and their floral wavy edges are a great vehicle for chickpeas and anchovies in the sauce. Orecchiette (ears) or conchiglia (shells), are also good for pickup and work great here too."},"vi":{"title":"Gigli nga adunay mga chickpeas ug za'atar","difficulty":"Medium","ingredients":["45ml lana sa oliba, dugang nga dugang nga pag-alagad","½ sibuyas, pinong tinadtad (100g)","2 madugmok nga mga clove sa ahos","2 tsp yuta cumin","10 g dahon sa thyme, pinong tinadtad","25 g anchovy fillets sa lana, drained ug lino nga fino nga tinadtad (mga 7)","1 lemon: guntinga ang panit nga manipis sa ½, dayon juice aron makuha ang 2 tbsp.","2 ka kahon sa 400 g nga giluto nga mga chickpeas, gihubas (480 g)","1 kutsarita nga humok nga brown nga asukal","400ml manok nga sabaw","200 g gigli pasta (o conchiglia o orechiette)","50 g gagmay nga dahon sa spinach","15g parsley, kasar","1½ kutsarita nga zaatar","asin ug itom nga paminta."],"directions":"Ibutang ang lana sa oliba sa usa ka dako nga sauté pan ug ibutang kini sa taas nga kainit. \nIdugang ang sibuyas, ahos, cumin, thyme, anchovies, lemon peel, ½ kutsarita nga asin ug maayong sili nga galingan.\n Pagprito sulod sa 3–4 ka minuto, pagpalihok kanunay, hangtud nga humok ug bulawan.\nPagminus sa kainit hangtod sa medium-high, dayon idugang ang mga chickpeas ug asukal ug pabukala sa 8 minuto, pagpalihok usahay, hangtod nga ang mga chickpeas magsugod sa brown ug chew.\nIdugang ang sabaw sa manok ug lemon juice ug simmer sa 6 minuto, hangtod nga ang sarsa gamay nga mikunhod. Kuhaa gikan sa kainit ug ibilin. \nMahimo nimo kini daan, kung gusto nimo, ug ipainit kini sa wala pa mag-alagad.\nDad-a sa usa ka dako nga kolon sa asin nga tubig ngadto sa usa ka hubag. \nIdugang ang pasta ug magluto sa 8 minuto, o sumala sa gisugo sa pakete, hangtod sa al dente. Kuhaa ug ipahilayo.\nIlakip ang spinach ug parsley sa mga chickpeas: ang nahabilin nga kainit sa sarsa kinahanglan magluto sa spinach, apan kung dili kini malaya, hinayhinay lang nga ipainit ang mga chickpeas sa kalan.\nIbalhin ang pasta sa chickpea pan ug pagpalihok aron isagol. \nBahina tali sa upat ka mga panaksan ug isablig ang zaatar sa ibabaw. Tapuson sa usa ka baso nga lana ug mag-alagad.","notes":"Gigli nagpasabut nga \"lirio\" sa Italyano, ug ang ilang mga bulak nga balud usa ka maayong salakyanan alang sa mga chickpeas ug mga anchovies sa sarsa. Ang Orecchiette (mga dalunggan) o conchiglia (mga kabhang), maayo usab alang sa pickup ug pagtrabaho og maayo dinhi usab."},"ratings":{},"tv":2},{"id":1775451164180,"emoji":"🥗","category":"plats","tags":["vegatarian","fresh","healthy"],"author":"Cousin Leopold","servings":"","prepTime":"30","cookTime":"0","totalTime":"0","bapRating":"","leahRating":"","photo":"//ottolenghi.co.uk/cdn/shop/files/Baby_spinach_salad_with_dates_almonds.jpg?v=1716838462&width=1000","custom":true,"fr":{"title":"Salade de bébés épinards aux dattes et amandes","difficulty":"Easy","ingredients":["1 càs de vinaigre de vin blanc","½ oignon rouge moyen, tranché finement","100 g de dattes medjool dénoyautées, en quartiers dans le sens de la longueur","30 g de beurre non salé","2 càs d'huile d'olive","2 petites pitas, environ 100g, grossièrement déchirées en morceaux de 4cm","75 g d'amandes entières non salées, grossièrement hachées","2 c. à thé de sumac","½ c. à thé de piment en flocons","150 g de petites feuilles d'épinards, lavées","2 c. à soupe de jus de citron","sel"],"directions":"Mettez le vinaigre, l'oignon et les dattes dans un petit bol. Ajoutez une pincée de sel et mélangez bien avec vos mains. Laisser mariner pendant 20 minutes, puis égoutter le vinaigre résiduel et jeter.\nPendant ce temps, faites chauffer le beurre et la moitié de l'huile d'olive dans une poêle moyenne. Ajoutez le pita et les amandes et faites-les cuire à feu moyen pendant 4 à 6 minutes, en remuant tout le temps, jusqu'à ce que le pita soit croquant et doré. Retirer du feu et mélanger le sumac, le piment et ¼ de cuillère à café de sel. Réserver pour refroidir.\nLorsque vous êtes prêt à servir, mélangez les feuilles d'épinards avec le mélange pita dans un grand bol. Ajouter les dattes et l'oignon rouge, le reste d'huile d'olive, le jus de citron et une autre pincée de sel. Goûtez à l'assaisonnement et servez immédiatement","notes":"Les Pitas se voient attribuer la durée de conservation la plus courte à Jérusalem. Idéalement, vous les mangeriez dans les deux heures qui suivent la cuisson. Les croûtons de pita croquants font bon usage des restes de pita. Nous les utilisons pour les soupes et les dispersons sur les salades et autres mezzés. Ils se conserveront au moins une semaine dans un récipient hermétique. Servez cette salade en entrée ; sa fraîcheur aiguisée aiguisera vraiment l'appétit.\n\nJ'ai apprécié tant de fois à leo et Audreyx place à Singapour !"},"en":{"title":"Baby spinach salad with dates & almonds","difficulty":"Easy","ingredients":["1 tbsp white wine vinegar","½ medium red onion, thinly sliced","100g pitted medjool dates, quartered lengthways","30g unsalted butter","2 tbsp olive oil","2 small pitas, about 100g, roughly torn into 4cm pieces","75g whole unsalted almonds, roughly chopped","2 tsp sumac","½ tsp chilli flakes","150g baby spinach leaves, washed","2 tbsp lemon juice","salt"],"directions":"Put the vinegar, onion and dates in a small bowl. Add a pinch of salt and mix well with your hands. Leave to marinate for 20 minutes, then drain any residual vinegar and discard.\nMeanwhile, heat the butter and half the olive oil in a medium frying pan. Add the pita and almonds and cook them on a medium heat for 4–6 minutes, stirring all the time, until the pita is crunchy and golden brown. Remove from the heat and mix in the sumac, chilli and ¼ teaspoon of salt. Set aside to cool.\nWhen you are ready to serve, toss the spinach leaves with the pita mix in a large mixing bowl. Add the dates and red onion, remaining olive oil, lemon juice and another pinch of salt. Taste for seasoning and serve immediately","notes":"Pitas are allotted the shortest of shelf lives in Jerusalem. Ideally, you’d eat them within a couple of hours of baking. Crunchy pita croutons make good use of leftover pita. We use them for soups and scatter them over salads and other mezzes. They will keep for at least a week in an airtight container. Serve this salad as a starter; its sharp freshness really whets the appetite.\n\nEnjoyed so many times at leo and Audreyx place in Singapore !"},"vi":{"title":"Baby spinach salad nga adunay mga petsa & almonds","difficulty":"Easy","ingredients":["1 tbsp puti nga suka sa alak","½ medium pula nga sibuyas, manipis nga gihiwa","100g pitted medjool mga petsa, quartered lengthways","30g unsalted butter","2 tbsp lana sa oliba","2 gamay nga pitas, mga 100g, halos gisi sa 4cm nga mga piraso","75g bug-os nga unsalted almendras, halos tinadtad","2 tsp nga sumac","½ tsp nga chilli flakes","150g baby spinach dahon, gihugasan","2 tbsp nga lemon juice","asin"],"directions":"Ibutang ang suka, sibuyas ug mga petsa sa usa ka gamay nga panaksan. Pagdugang usa ka kutsara nga asin ug isagol nga maayo sa imong mga kamot. Biyai nga mag-marinate sulod sa 20 minutos, dayon ipahid ang bisan unsang nahibilin nga suka ug isalikway.\nSa kasamtangan, ipainit ang mantikilya ug katunga sa lana sa oliba sa usa ka medium frying pan. Idugang ang pita ug mga almendras ug lutoon kini sa usa ka kasarangan nga kainit sulod sa 4–6 ka minuto, pagpalihok sa tanan nga mga panahon, hangtud nga ang pita crunchy ug bulawan nga brown. Kuhaa gikan sa kainit ug isagol sa sumac, chilli ug ½ kutsarita nga asin. Ibutang sa bugnaw.\nKung andam ka na nga mag-alagad, ilabay ang mga dahon sa spinach nga adunay sagol nga pita sa usa ka dako nga panaksan nga pagsagol. Idugang ang mga petsa ug pula nga sibuyas, nahabilin nga lana sa oliba, lemon juice ug usa pa nga pinch nga asin. Pagtilaw sa panimpla ug pag-alagad dayon","notes":"Kini sila nga mga matang makit an sa \"Jerusalem.\" Gikaon nimo kini sulod sa pipila ka oras human sa pagpamiyuos. Ang mga crunchy pita crouton naghimo og maayo nga paggamit sa wala nga pita. Gigamit namon kini alang sa mga sabaw ug gisabwag kini sa mga salad ug uban pang mga mezzes. Kinahanglan sila magpabilin labing menos usa ka semana sa usa ka sudlanan nga wala 'y hangin. Pag-alagad sa kini nga salad ingon usa ka starter; ang mahait nga kabag-o niini tinuud nga nagpatig-a sa gana.\n\nNalingaw kaayo sa daghang mga higayon sa lugar sa leo ug Audreyx sa Singapore !"},"ratings":{"papa":5,"juju":5},"tv":2},{"id":1775223651880,"emoji":"🍲","category":"plats","tags":["homy","france","facile","baptiste classique"],"author":"Baptiste","servings":"6","prepTime":"","cookTime":"20 min","totalTime":"20 min","bapRating":"","leahRating":"","photo":"https://img.cuisineaz.com/1064x1064/2013/12/20/i28704-poulet-a-la-creme-et-aux-champignons.jpg","custom":true,"fr":{"title":"Poulet à la crème et aux champignons","difficulty":"Facile","ingredients":["6 Blanc(s) de poulet","1 Oignon(s) blanc(s)","1 verre(s) Vin blanc (optionel)","1 boîte(s) Champignon(s) de paris","2 c. à soupe Moutarde","1 pot(s) de 20cl Crème fraîche épaisse","1 c. à soupe Huile d'olive","Sel poivre du moulin"],"directions":"Émincez finement l'oignon et faites-le revenir dans une cocotte avec l'huile d'olive. Ajoutez ensuite les blancs de volaille et laissez-les dorer sur les 2 faces. Lorsqu'ils sont bien colorés, ajoutez les champignons que vous aurez coupés en tranches fines. Salez et poivrez à votre convenance.\nAjoutez la moutarde et le vin blanc au mélange. Lorsque l'alcool s'est évaporé, ajoutez la crème fraîche et diminuez le feu de cuisson. Laissez mijoter pendant 20 min à feu doux.\nLorsque vos escalopes sont parfaitement cuites et imprégnées de la sauce aux champignons, servez-les immédiatement. ","notes":"Un délice qui plait à toutes et à tous : les escalopes de poulet aux champignons et à la crème. C'est divin et ultra simple à réaliser ! Il vous faut juste des beaux morceaux de poulet dorés à souhait, accompagnés d'une bonne sauce aux champignons de Paris à la crème fraîche, et rehaussée de moutarde et de vin blanc... Régal et plaisir à table aujourd'hui ! Servies avec une timbale de riz basmati , du boulgour ou des tagliatelles fraîches, c'est le succès assuré ! \nPossible de remplacer le poulet par de la dinde."},"en":{"title":"Creamy Chicken with Mushrooms","difficulty":"Easy","ingredients":["6 chicken breast fillets","1 white onion","1 glass white wine (optional)","1 tin button mushrooms","2 tbsp mustard","200ml thick cream","15ml olive oil","Salt, pepper"],"directions":"Finely slice the onion and sauté in a casserole with olive oil. Add the chicken breasts and brown on both sides.\nOnce golden, add the mustard and white wine. Let it reduce for a few minutes.\nAdd the drained mushrooms. Season with salt and pepper.\nPour in the cream, stir well. Simmer for 20 minutes on low heat.\nServe with rice or pasta.","notes":""},"vi":{"title":"Manok nga adunay Krema ug Mushroom","difficulty":"Sayon","ingredients":["6 ka dughan sa manok","1 puting sibuyas","1 baso puting bino (opsyonal)","1 lata mushroom","2 kutsara mustasa","200ml espeso nga krema","15ml lana sa olibo","Asin, paminta"],"directions":"Hiwa-a ang sibuyas ug igisa sa kaldero uban ang lana. Idugang ang manok ug doraha sa duha ka kilid.\nKung bulawan na, idugang ang mustasa ug bino. Pabukalaha og pipila ka minuto.\nIdugang ang mushroom. Timpla-i og asin ug paminta.\nIbubo ang krema, kuyoga. Pakalma-a og 20 minuto sa hinay nga kalayo.\nIsilbi uban ang kan-on o pasta.","notes":""},"ratings":{},"tv":2},{"id":1775222902765,"emoji":"🍋","category":"plats","tags":["poisson","beurre","citron"],"author":"Maman","servings":"4","prepTime":"10 min","cookTime":"15 min","totalTime":"25 min","bapRating":"","leahRating":"","photo":"https://www.theseasonedmom.com/wp-content/uploads/2018/09/dump-and-bake-italian-fish-with-broccoli-and-rice-15.jpg","custom":true,"fr":{"title":"Cabillaud poêlé, beurre coriandre-citron vert","difficulty":"Facile","ingredients":["120 g de beurre doux ramolli","1 càs de jalapeño finement haché (épépiné)","1 càc de zeste de citron vert","1 càc de jus de citron vert","80 ml de coriandre fraîche ciselée","1 pincée de sel","4 filets de cabillaud (170-230 g chacun)","Sel et poivre","2 càs d'huile d'olive","Coriandre fraîche pour servir (optionnel)","Quartiers de citron vert (optionnel)"],"directions":"Beurre composé : mélanger le beurre, le jalapeño, le zeste, le jus de citron vert, la coriandre et le sel. Rouler dans du film alimentaire et réfrigérer au moins 1 h.\nSécher les filets de cabillaud et les assaisonner de sel et de poivre.\nChauffer l'huile dans une poêle à feu moyen-vif. Cuire les filets 3-4 min de chaque côté.\nServir chaque filet avec une tranche de beurre composé et des quartiers de citron vert.","notes":"Un plat simple et rapide ; le beurre composé peut se préparer à l'avance."},"en":{"title":"Pan-Seared Cod with Cilantro-Lime Compound Butter","difficulty":"Easy","ingredients":["120g unsalted butter, softened","15ml finely minced jalapeño (seeds removed)","5ml lime zest","5ml fresh lime juice","80ml finely chopped fresh cilantro","Pinch of salt","4 cod fillets (170-230g each)","Salt and pepper","30ml olive oil","Fresh cilantro for serving (optional)","Lime wedges (optional)"],"directions":"Compound butter: mix butter, jalapeño, zest, lime juice, cilantro and salt. Roll in plastic wrap and refrigerate.\nPat cod fillets dry and season with salt and pepper.\nHeat oil in a skillet over medium-high heat. Cook fillets 3-4 min per side until golden and cooked through.\nServe with a slice of compound butter on each fillet.","notes":""},"vi":{"title":"Cod nga Giprito uban Cilantro-Lime Mantikilia","difficulty":"Sayon","ingredients":["120g mantikilia walay asin (palambuta)","15ml jalapeño nga nipis (walay liso)","5ml kubal sa lime","5ml duga sa lime","80ml cilantro nga gidugmok","Kurot sa asin","4 ka pirasong cod (170-230g ang matag usa)","Asin ug paminta","30ml lana sa olibo","Cilantro (opsyonal)","Mga slice sa lime (opsyonal)"],"directions":"Sagola ang mantikilia, jalapeño, kubal, duga sa lime, cilantro ug asin. Balutona og plastik ug ibutang sa ref.\nPahira ang cod ug timplaha og asin ug paminta.\nInit-a ang lana sa kaldero. Lutoa ang cod og 3-4 min matag kilid.\nIsilbi uban ang usa ka slice sa mantikilia.","notes":""},"ratings":{},"tv":2},{"id":1775222595323,"emoji":"🍽️","category":"plats","tags":["vegetarian","thon","rapide","simple"],"author":"Loic Pompui","servings":"4","prepTime":"10 min","cookTime":"10 min","totalTime":"10 min","bapRating":"","leahRating":"","photo":"https://img-3.journaldesfemmes.fr/ybAq--ppFLvjaF7IBFdqbjfFS1s=/750x500/8d8f4e41ccf14894b71036fa69a54589/ccmcms-jdf/39714014.jpg","custom":true,"fr":{"title":"Pâtes au thon, crème et tomate à l'italienne","difficulty":"Facile","ingredients":["400 g penne (plus ou moins selon l'appétit)","1 oignon","280 g thon au naturel (poids égoutté)","400 g bonne sauce tomate (maison c'est encore mieux)","10 cl crème liquide","huile d'olive","sel et poivre","parmesan ou gruyère"],"directions":"Éplucher et émincer finement l'oignon.\nChauffer un filet d'huile d'olive dans une poêle à bord haut (ou une sauteuse) et faire suer l'oignon sur feu doux pour qu'il soit translucide et non coloré. \nPlacer une casserole d'eau salée à bouillir et y plonger les pâtes le temps indiqué.\nAjouter la sauce tomate, le thon, le sel et le poivre à l'oignon, bien mélanger et laisser mijoter pendant la cuisson des pâtes.\n\nEn fin de cuisson ajouter la crème liquide à la sauce tomate/thon et bien mélanger. Égoutter les pâtes, les enrober de sauce et servir aussitôt !\nOn peut si on le souhaite ajouter du persil ou du fromage (type gruyère ou parmesan) à la recette.","notes":"Découvrez ma recette de pâtes au thon, crème et tomate, idéale pour vos repas du quotidien. Inspirée des pâtes à l'italienne, cette recette sicilienne est vraiment simple à réaliser avec du thon en boîte."},"en":{"title":"Italian-Style Tuna Pasta with Cream & Tomato","difficulty":"Easy","ingredients":["400g penne","1 onion","280g canned tuna (drained weight)","400g tomato sauce","100ml single cream","Olive oil","Salt and pepper","Parmesan or gruyère"],"directions":"Peel and finely slice the onion. Heat olive oil in a pan and sweat the onion on low heat.\nAdd the drained, flaked tuna. Sauté for 2 minutes.\nPour in the tomato sauce, stir, then add the cream. Season.\nSimmer for 10 minutes on low heat.\nCook pasta according to instructions, drain and toss with the sauce.\nServe with grated parmesan.","notes":""},"vi":{"title":"Pasta sa Tuna, Krema ug Kamatis","difficulty":"Sayon","ingredients":["400g penne","1 sibuyas","280g tuna (gihugas)","400g sarsa sa kamatis","100ml krema","Lana sa olibo","Asin ug paminta","Parmesan o gruyère"],"directions":"Panita ang sibuyas ug igisa sa lana sa olibo sa hinay nga kalayo.\nIdugang ang tuna. Igisa og 2 minuto.\nIbubo ang sarsa sa kamatis ug krema. Timplaha.\nPakalma-a og 10 minuto.\nLutoa ang pasta, ihubas ug isagol sa sarsa.\nIsilbi uban ang parmesan.","notes":""},"ratings":{}},{"id":1775222286628,"emoji":"🍽️","category":"plats","tags":["pate","simple","famille"],"author":"Fred","servings":"","prepTime":"5","cookTime":"15","totalTime":"15","bapRating":"","leahRating":"","photo":"https://i.ibb.co/WN7J886J/Screenshot-20260403-210426-Whats-App.png","custom":true,"fr":{"title":"Coquilettetoto","difficulty":"Facile","ingredients":["250 g de coquillettes","1 onion","20 cl de vin blanc (optionnel)","Bouillon de poulet ou legumes","20g Beurre","20g Parmesan râpé","20cl Crème fraîche","200g champignons, lardons, saumon et poireaux (au choix)"],"directions":"Faire revenir les onions dans la poele puis verser les coquilettes jusqu'a ce que devienne translucides ( attention a ne pas les faire bruler)\nAjouter le verre de vin blanc (optionnel)\nVerser le bouillon (legume, poulet ou autres) sans le faire bouillir, et ajouter du bouillon au fur et a mesure de l'evaporation.\nFaire cuire les pates le temps de cuisson indiquer sur la boite (environ 8min)\nGouter, pour que ce soit fondant a l'exterieur mais ferme a l'interieur.\nEnsuite, ajouter un beure de beuure, parmesan râpé, et un peu de crème fraîche\n\nA marier avec champignons, Suamon/poireaux, lardons, selon ses desirs\n\n","notes":""},"en":{"title":"Coquilettetoto","difficulty":"Easy","ingredients":["250g elbow pasta","1 onion","200ml white wine (optional)","Chicken or vegetable stock","20g butter","20g grated parmesan","200ml cream","200g mushrooms, bacon, salmon or leeks (your choice)"],"directions":"Sauté the onion then add the pasta and toast until translucent (be careful not to burn).\nAdd the white wine (optional).\nGradually pour in the stock like a risotto, stirring regularly.\nAdd your chosen topping (mushrooms, bacon, etc.).\nFinish with butter, cream and parmesan. Serve hot.","notes":""},"vi":{"title":"Coquilettetoto","difficulty":"Sayon","ingredients":["250g elbow pasta","1 sibuyas","200ml puting bino (opsyonal)","Sabaw sa manok o utan","20g mantikilia","20g parmesan","200ml krema","200g mushroom, bacon, salmon o sibuyas dahon (pilia)"],"directions":"Igisa ang sibuyas ug idugang ang pasta hangtud mahimong translucent.\nIdugang ang bino (opsyonal).\nIbubo ang sabaw anam-anam sama sa risotto.\nIdugang ang gipili nga topping.\nTapusa uban ang mantikilia, krema ug parmesan. Isilbi nga mainit.","notes":""},"ratings":{},"tv":2},{"id":1775219130951,"emoji":"🍽️","category":"plats","tags":["vegetarian","yummy","family favourite"],"author":"Leah","servings":"4","prepTime":"","cookTime":"40 min","totalTime":"40 min","bapRating":"","leahRating":"","photo":"https://asset.jamieoliver.com/images/cq7w2e71/production/b9291dd6afead7ffac3a45b23b8b9c2a8722606e-973x1300.jpg/46337852?rect=0,164,973,973&w=600&h=600&fm=webp&q=75&fit=crop&auto=format","custom":true,"fr":{"title":"Wraps mexicains aux haricots rouges","difficulty":"Facile","ingredients":["1 oignon","1 poivron rouge","60 g de cheddar","Huile d'olive","1 gousse d'ail","1 avocat en dés","1 càc de poudre de chili","1 càc de concentré de tomate","1 boîte de tomates pelées (400 g)","1 boîte de haricots rouges (400 g)","4 grandes tortillas de blé","2 grosses poignées de salade mélangée","Vinaigre balsamique"],"directions":"Préchauffer le four à 180°C. Émincer l'oignon, épépiner et émincer le poivron. Râper le cheddar.\nChauffer un peu d'huile et faire fondre l'oignon 10 min. Ajouter l'ail pressé, le chili et le concentré de tomate. Cuire 1 min.\nAjouter les tomates et les haricots égouttés. Mijoter 10 min, saler et poivrer.\nMixer la moitié du mélange en purée et la tartiner sur les tortillas. Répartir le reste de garniture, le poivron et le fromage. Rouler.\nEnfourner 5-10 min. Servir avec la salade assaisonnée d'huile et de vinaigre balsamique.","notes":"Recette de burritos végétariens de Jamie Oliver, rapide pour un soir de semaine."},"en":{"title":"Mexican Bean Wraps","difficulty":"Easy","ingredients":["1 onion","1 red pepper","60g cheddar cheese","Olive oil","1 clove of garlic","1 diced avocado","1 tsp chilli powder","1 tsp tomato purée","400g tin of plum tomatoes","400g tin of red kidney beans","4 large flour tortillas","2 large handfuls of mixed salad leaves","Balsamic vinegar"],"directions":"Preheat oven to 180°C. Peel and finely slice the onion. Deseed and slice the pepper. Grate the cheese.\nHeat oil in a pan over medium-low heat and cook the onion for 5 min. Add crushed garlic, chilli and tomato purée. Cook 1 min.\nAdd the tomatoes and drained beans. Simmer for 10 min, lightly crushing the beans.\nFill tortillas with the mixture, pepper, cheese and salad. Roll and serve.","notes":""},"vi":{"title":"Mexican Bean Wraps","difficulty":"Sayon","ingredients":["1 sibuyas","1 pula nga sili","60g cheddar","Lana sa olibo","1 bawang","1 abokado nga gidais","1 kutsarita chili powder","1 kutsarita tomato paste","400g lata sa kamatis","400g lata sa kidney beans","4 dako nga tortilla","2 hakop salad","Balsamic vinegar"],"directions":"Painita ang oven sa 180°C. Hiwa-a ang sibuyas ug sili.\nInit-a ang lana ug lutoa ang sibuyas og 5 min. Idugang ang bawang, chili ug tomato paste. Lutoa og 1 min.\nIdugang ang kamatis ug beans. Pakalma-a og 10 min.\nPun-a ang tortilla, ilukot ug isilbi.","notes":""},"ratings":{},"tv":2},{"id":18,"emoji":"🍳","category":"plats","tags":["vege","healthy","rapide"],"author":"","servings":"2-3","prepTime":"5 min","cookTime":"20 min","totalTime":"25 min","bapRating":"","leahRating":"","photo":"https://downshiftology.com/wp-content/uploads/2023/12/Shakshuka-main-1-500x500.jpg","custom":true,"fr":{"title":"Shakshuka","difficulty":"Facile","ingredients":["2 càs huile d'olive","1 oignon émincé","1 poivron rouge en dés","3 gousses d'ail émincées","1 càc cumin","1 càc paprika fumé","½ càc piment de Cayenne","1 boîte de tomates concassées (400 g)","4-6 œufs","Sel et poivre","Persil frais ou coriandre","Pain pita pour servir","Optionnel : feta émiettée"],"directions":"Chauffer l'huile dans une grande poêle. Faire revenir l'oignon 5 min. Ajouter le poivron, cuire 3 min.\nAjouter l'ail, le cumin, le paprika et le piment. Cuire 1 min.\nAjouter les tomates. Saler, poivrer. Mijoter à feu doux 8-10 min.\nFaire des puits dans la sauce. Casser un œuf dans chaque puits. Couvrir et cuire 5-8 min selon la texture souhaitée.\nParsemer de persil ou de feta. Servir avec du pain.","notes":"Parfait pour un brunch rapide ou un dîner végétarien. Se prépare à l'avance jusqu'à l'étape 3."},"en":{"title":"Shakshuka","difficulty":"Easy","ingredients":["2 tbsp olive oil","1 onion, thinly sliced","1 red bell pepper, diced","3 garlic cloves, minced","1 tsp cumin","1 tsp smoked paprika","½ tsp cayenne pepper","1 tin crushed tomatoes (400 g)","4-6 eggs","Salt and pepper","Fresh parsley or cilantro","Pita bread, to serve","Optional: crumbled feta"],"directions":"Heat the oil in a large skillet. Sauté the onion for 5 min. Add the bell pepper, cook 3 min.\nAdd the garlic, cumin, paprika and cayenne. Cook 1 min.\nAdd the tomatoes. Season with salt and pepper. Simmer on low heat 8-10 min.\nMake wells in the sauce. Crack an egg into each well. Cover and cook 5-8 min to your liking.\nSprinkle with parsley or feta. Serve with bread.","notes":"Perfect for a quick brunch or a vegetarian dinner. Can be prepared ahead up to step 3."},"vi":{"title":"Shakshuka","difficulty":"Sayon","ingredients":["2 kutsara lana sa olibo","1 sibuyas, hiniwa og nipis","1 pula nga bell pepper, gidais","3 ka buok ahos, gidugmok","1 kutsarita cumin","1 kutsarita smoked paprika","½ kutsarita cayenne","1 lata sa dinugmok nga kamatis (400 g)","4-6 ka itlog","Asin ug paminta","Presko nga perehil o cilantro","Pita nga pan, isilbi","Opsyonal: gibuak nga feta"],"directions":"Init-a ang lana sa dako nga kalaha. Igisa ang sibuyas og 5 min. Idugang ang bell pepper, lutoa og 3 min.\nIdugang ang ahos, cumin, paprika ug cayenne. Lutoa og 1 min.\nIdugang ang kamatis. Timplahi og asin ug paminta. Pabukala sa hinay nga kalayo og 8-10 min.\nHimoa og mga lungag sa sarsa. Buak-a ang itlog sa matag lungag. Taboni ug lutoa og 5-8 min.\nSabwagi og perehil o feta. Isilbi uban ang pan.","notes":"Maayo alang sa paspas nga brunch o vegetarian nga panihapon."},"ratings":{"papa":5},"tv":2},{"id":1775196036572,"emoji":"🍗","category":"plats","tags":["poulet","diner","familial"],"author":"Maman","servings":"4","prepTime":"15","cookTime":"20","totalTime":"20","bapRating":"","leahRating":"","photo":"https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcTqbtI6wtLgc5bvXnU3EWmHnaCSZKm5Wnxnhw&s","custom":true,"fr":{"title":"Poulet à l'estragon et à la crème","difficulty":"Facile","ingredients":["1 poulet (coupé en morceaux)","2 cuillerées à soupe d’huile d’olive","1 échalote","150ml de vin blanc sec ( pas obligatoire pour les enfants)","500ml de bouillon de poule","1 bouquet d’estragon","40cl de crème (fleurette) liquide entière","sel, poivre"],"directions":"Faites chauffer une cocotte sur feu modéré avec l’huile d’olive. Ajoutez le poulet. \n \n\n\n \n\nLaissez-le se colorer en le retournant de temps en temps. En tout cela prend une dizaine de minutes. \n \n\n\n \nHachez finement l’échalote. \n \n\nÔtez le poulet de la cocotte en y laissant le gras (c’est bon le gras !) et mettez à la place l’échalote.\n\n\nRemuez régulièrement pendant deux ou trois minutes puis ajoutez le vin et le bouillon de poule.\n\n\n \n\nRemettez le poulet. J’enlève à ce moment la plupart de la peau, sinon le plat devient trop gras. J’en laisse sur un morceau de haut de cuisse par exemple.\n \n\n\nFaites cuire sur modéré pendant vingt à trente minutes. Vérifiez bien la cuisson du poulet. Quand il est cuit, enlevez-le du bouillon et mettez-le de côté dans une assiette.\nLaissez maintenant réduire le bouillon de moitié. Cela peut prendre un peu de temps.\nHachez grossièrement l’estragon.\n\n\nMettez-le dans le bouillon.\n\n\n \n\nVersez la crème entière.\nNote de Maman: si vous préférez ne pas mettre de crème, il faudra dans ce cas ajouter une cuillerée à soupe de farine dans les échalotes avant de verser le bouillon et le vin. Sinon la sauce sera liquide comme de l’eau !\n \n\n\n \n\n\n \n\nLaissez de nouveau réduire jusqu’à la consistance désirée. Pour moi c’est comme pour une crème anglaise. La sauce doit napper la cuillère.\nSalez et poivrez à votre goût.\n \n\n\nQuand c’est le cas, remettez le poulet et laissez réchauffer une dizaine de minutes avant de servir avec un riz nature, des pommes de terre vapeur ou des pâtes.\n\n\n \nRégalez-vous !!","notes":"enelever le vin blanc pour enfant.  Shelrie recommends to add more shallots"},"en":{"title":"Cream Tarragon Chicken","difficulty":"Facile","ingredients":["1 chicken (chopped)","2 tbsp olive oil","1 shallot","150ml dry white wine ( not mandatory for children)","500ml chicken broth","1 bunch of tarragon","40cl whole liquid cream (floret)","salt, pepper"],"directions":"Heat a casserole over moderate heat with olive oil. Add the chicken. \n \n\n\n \n\nLet it turn color by turning it upside down from time to time. In all, it takes about ten minutes. \n \n\n\n \nFinely chop the shallot. \n \n\nRemove the chicken from the casserole, leaving the fat (the fat is good!) and put the shallot in its place.\n\n\nStir regularly for two or three minutes and then add the wine and chicken broth.\nPut the chicken back on. I remove most of the skin at this time, otherwise the dish becomes too oily. I leave some on a piece of thigh for example.\n \n\n\nCook on moderate for twenty to thirty minutes. Make sure the chicken is cooked thoroughly. When cooked, remove it from the broth and set it aside on a plate.\nNow let the broth cut in half. This may take some time.\nRoughly chop the tarragon.\n\n\nPut it in the broth.\nPour in the whole cream.\nMom's note: if you prefer not to use cream, you will need to add a tablespoon of flour to the shallots before pouring the broth and wine. Otherwise the sauce will be liquid like water!\n \n\n\n \n\n\n \n\nAllow to reduce again to the desired consistency. For me it's like a custard. The sauce should top the spoon.\nSeason with salt and pepper to your liking.\nWhen this is the case, put the chicken back on and let it reheat for about ten minutes before serving with plain rice, steamed potatoes or pasta.\n\n\n \nEnjoy!!","notes":"remove white wine for children"},"vi":{"title":"Cream Tarragon Manok","difficulty":"Facile","ingredients":["1 ka manok (tinadtad)","2 kutsara nga lana sa oliba","1 nga shallot","150ml uga nga puti nga alak ( dili mandatory alang sa mga bata)","500ml manok nga sabaw","1 ka buok tarragon","40cl bug-os nga liquid cream (floret)","asin, paminta"],"directions":"Pagpainit sa usa ka casserole sa kasarangan nga kainit nga adunay lana sa oliba. Idagdag ang manok. \n \n\n\n \n\nHimoa kini nga kolor pinaagi sa pag-usab niini pabalik-balik matag karon ug unya. Sa kinatibuk-an, kini nagkinahanglan og mga napulo ka minutos. \n \n\n\n \nHingpit nga pagputol sa shallot. \n \n\nKuhaa ang manok gikan sa casserole, ibilin ang tambok (maayo ang tambok!) ug ibutang ang shallot sa lugar niini.\n\n\nPagpalihok kanunay sulod sa duha o tulo ka minuto ug dayon idugang ang bino ug sabaw sa manok.\nIbalik ang manok. gikuha nako ang kadaghanan sa panit sa kini nga oras, kung dili ang pinggan nahimo 'g sobra nga lana. Pananglitan, ibilin nako ang pipila sa usa ka piraso sa paa.\n \n\n\nMagluto sa kasarangan alang sa kaluhaan ngadto sa katloan ka minutos. Siguruha nga ang manok hingpit nga giluto. Kon lutoon, kuhaa kini gikan sa sabaw ug ibutang kini sa usa ka plato.\nKaron tugoti ang sabaw nga putlon sa katunga. Mahimong magkinahanglan kini og panahon.\nHapit nalukop sa durowan ug kabugangan ang palibot sa Tarragon.\n\n\nIbutang sa sabaw.\nIbubo sa tibuok cream.\nMubo nga sulat ni Mama: kung gusto nimo nga dili mogamit cream, kinahanglan nimo nga idugang ang usa ka kutsara nga harina sa mga sibuyas sa wala pa ibubo ang sabaw ug bino. Kay kon dili, ang sarsa mahimong likido sama sa tubig!\n \n\n\n \n\n\n \n\nTugoti nga maminusan pag-usab ang gitinguha nga pagkamakanunayon. Alang kanako kini sama sa usa ka tigbantay. Ang sarsa kinahanglan nga mag-una sa kutsara.\nPanahon nga adunay asin ug paminta sumala sa imong gusto.\nKung kini ang kaso, ibalik ang manok ug ipainit usab kini mga napulo ka minuto sa wala pa mag-alagad sa yano nga bugas, steamed patatas o pasta.\n\n\n \nEnjoy sa!!","notes":"kuhaa ang puti nga bino alang sa mga bata"},"ratings":{"mummy":4,"papa":5,"juju":4},"tv":2},{"id":1775195686229,"emoji":"🍽️","category":"plats","tags":[],"author":"Maman d'Anne Sophie Pic","servings":"","prepTime":"","cookTime":"","totalTime":"","bapRating":"","leahRating":"","photo":"data:image/jpeg;base64,/9j/4AAQSkZJRgABAQAAAQABAAD/2wCEAAkGBxITEhUSExMWFRUVFRUXFxUYGBcVFxUYGBcXGBcWGBgYHSggGBolGxcVIzEhJSkrLi8uFx8zODMsNygtLisBCgoKDg0OGxAQGzAlHyUyLS8tLS0uLS0tLS0tLS01LSstLS0rLS4tKy0vLS0tLS0tLy0tLS0tKy0rLS0tLS0tLf/AABEIAOEA4QMBIgACEQEDEQH/xAAcAAABBAMBAAAAAAAAAAAAAAAAAwQFBgECBwj/xABFEAABAwIEAwYDBQUGAwkAAAABAAIRAyEEBRIxQVFhBhMicYGRMqGxQlLB0fAHFBUj4UNicoKS8TNTkxYXJFRjg5Sy0v/EABoBAAIDAQEAAAAAAAAAAAAAAAABAgMEBQb/xAAzEQACAgEDAgQEAwgDAAAAAAAAAQIRAxIhMQRBIlGR8BNhgdEFMuEUQlJxobHB8SMzU//aAAwDAQACEQMRAD8A7ihCEACEIQAIQhAAhCEACEIQAIWCYuU1/iVGSBUaSNwCHH5JOSXI0m+B2hMMTnFFglxd5CnUcfZrSUlh+0GHfEPIJEw5j2keciyh8XH/ABL1JfDn5MlEJGjiqbvhe13kQfollNNPgi1QIQhMQIQhAAhCEACEIQAIQhAAhCEACEIQAIQhAAhCEACELBKAMoTevi2tE7+Sq2N7SvLnhp0aGlwkfFH14+yy5urx49uX8i7Hglk4LikMVigwXuTsOaq+Wdse8pSdGvkXaA7ewJmDbY7rOGzTv9Lt3PLmwJIY2TLieENkdSQq112OdKHL9+pY+lnFvV2MYg1a7iSfCDtqIY0ixAIEuO9/mEOpPZdsN/w+In324J4XNYAxgsJ2sAo/EYoj7NvP9fJczqMu9s0w4pcGjatV0kk32a757AEH3TStmLdYpGm7VHiImOPHY7LOHzTU6JgN3ME+krbMK9Li4lxEt3ALbbAeXHmsLkmrbLkmnVDWhVpuECoAZ+K7R8gQd/mpjB5w6j4ZmmIDSdzwkHVz4fRQTqeoyAILBcRvuAOe53SVF7wwk203AbcuIJkQefnunjzzhtGVe/QsnijPdl+wubahJEc7GPfgn9PENOxXIj2kratIp4hoIu4C4EyZ1Foj1J6KYyvNsQ9rnAhgBiSBqfygusNjYe66mHrckF/ybnOl07k/DHb57HSkKr4HEv3a95bc6S46o4QT5/JSOGzpumahgCZJ3EcSBwi88BvC6WLqYT7lEsMkS6FrTqBwDmkEHYgyD5ELZaCoEIQgAQhCABCEIAEIQgAQhCABavcACTsFsmuaUHPpPY0w5zSAoZG1FuPPYcUm9yk5/n1apULKbi1g4NsT6hMssxeg6nvMusL3sfqmGJpV6Jc1whwFpEW4QsjFHQ0R4juT04rzby5NVye51VjjppcFjzLHuNMhh8e+naY4dFRcw7UUqxDBcwLmxB4g38J/RT3Lq1T97brHgM+InbifoubdrssqU8xqtpAkVKmpnFo7wzJ6SSVbixxzSbm6fb6BXw+FZYcTh6gs0lwPij4uFzI2EFWDsDnFQB9K4c0HfkTII6Q4e3RNcYaWHoMpBwe43e8xJdET0AuAFEZSX9+2q2YFnAW8G2/ATf0VcradeptVyx+Lg6415gOnUI3TXHVNwN9hPHmoiljgATI5u8URAnjvA/NQmN7XNqOe1nhDGgl2oAuEWuR4ATad+QVOOMsi2Rz8klie5aQ9jBDyLzMwPL9Dom781w5Y6S
