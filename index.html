s":"Preheat the oven to 150°C. Defeat the chicken and spread the wings and thighs slightly.\n\nIn a casserole dish or large glass dish, pour a generous drizzle of olive oil, arrange half of the tarragon sprigs in the bottom and the other half in the chicken chest, with two nice pinches of salt.\nPlace the chicken in the casserole, massage it with butter. Also pour a drizzle of olive oil, and two more pinches of salt on the poultry. By absorbing moisture, the salt will make the skin crispier.\n\nArrange the whole, unpeeled garlic cloves around the chicken.\n\nBake for 3 hours, taking care to turn the chicken regularly for even cooking.\n\nEnjoy!","notes":"add cream?"},"vi":{"title":"Tarragon manok","difficulty":"","ingredients":["1 nindot nga manok sa mag-uuma","1 ka dako nga hugpong sa tarragon","6 cloves sa ahos (unpeeled)","50 g nga mantikilya","Lana","Asin"],"directions":"Preheat ang oven ngadto sa 150° C. Pildihon ang manok ug ipakaylap ang mga pako ug mga paa nga gamay.\n\nSa usa ka pinggan nga casserole o dako nga pinggan nga baso, ibubo ang usa ka manggihatagon nga drizzle sa lana sa oliba, paghan-ay sa katunga sa mga sprigs sa tarragon sa ilawom ug ang laing katunga sa dughan sa manok, nga adunay duha ka nindot nga pinches sa asin.\nIbutang ang manok sa casserole, pagmasahe nga adunay mantikilya. Usab ibubo sa usa ka drizzle sa lana sa oliba, ug duha ka dugang nga pinches sa asin sa ibabaw sa mga manok. Pinaagi sa pagsuyup sa kaumog, ang asin maghimo sa panit nga labi ka crispier.\n\nPaghan-ay sa tibuuk, wala 'y paki nga mga ahos sa ahos sa palibot sa manok.\n\nPagluto sulod sa 3 ka oras, pag-amping nga kanunay nga ibalik ang manok alang sa bisan pagluto.\n\nEnjoy sa!","notes":"dagdagan ang cream?"},"ratings":{}},{"id":4,"emoji":"🍝","category":"plats","tags":["vege","rapide"],"author":"","servings":"4","prepTime":"15 min","cookTime":"10 min","totalTime":"25 min","bapRating":"","leahRating":"","photo":"https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcRl-Z5IcGsbgaYc58nZbYzU_FlerodqLsSwEw&s","custom":true,"fr":{"title":"Pasta à la Betterave Rose","difficulty":"Facile","ingredients":["250 g de ricotta","250 g de betterave cuite","350 g de pâtes (penne)","50 g de parmesan râpé","Basilic violet si possible","Huile d'olive","Sel et poivre"],"directions":"Mixer la ricotta et la betterave coupée. Ajouter sel, poivre et un filet d'huile. La sauce rose est prête !\nCuire les pâtes aux ¾ du temps indiqué. Égoutter (garder l'eau de cuisson).\nTransférer dans une sauteuse avec un filet d'huile. Ajouter la sauce avec une louche d'eau de cuisson. Bien mélanger.\nHors du feu, ajouter le parmesan. Garnir de basilic.","notes":""},"en":{"title":"Pink Beetroot Pasta","difficulty":"Easy","ingredients":["250 g ricotta","250 g cooked beetroot","350 g pasta (penne)","50 g grated Parmesan","Purple basil if possible","Olive oil","Salt and pepper"],"directions":"Blend the ricotta and chopped beetroot together. Season with salt, pepper and a drizzle of oil. Pink sauce ready!\\nCook pasta for ¾ of the indicated time. Drain (keep some cooking water).\\nTransfer to a pan with a drizzle of oil. Add the sauce and a ladle of pasta water. Mix well.\\nOff the heat, add Parmesan. Garnish with basil.","notes":""},"vi":{"title":"Rosas nga Pasta sa Betabol","difficulty":"Sayon","ingredients":["250 g ricotta","250 g niluto nga betabol","350 g pasta (penne)","50 g gibuak nga parmesan","Violet nga basil kung anaa","Lana sa olibo","Asin ug paminta"],"directions":"Ibungkag ang ricotta ug ginputol nga betabol. Timplahan sa asin, paminta, ug gamay nga lana. Handa na ang rosas nga sarsa!\\nLutua ang pasta sa ¾ sa gipaila nga oras. Ilabay ang tubig (tipiga ang tubig sa pagluto).\\nIbalhin sa kawali nga may lana. Idugang ang sarsa ug kulo sa tubig sa pasta. Ihalo pag-ayo.\\nGawas sa init, idugang ang parmesan. Dekorahan og basil.","notes":""},"ratings":{}},{"id":12,"emoji":"🥗","category":"salades","tags":["vege","rapide"],"author":"Maman Chommeloux","servings":"4","prepTime":"15 min","cookTime":"","totalTime":"15 min","bapRating":"","leahRating":"","photo":"https://lens.usercontent.google.com/banana?agsi=CmdnbG9iYWw6OjAwMDA1NWNmZWM3MDAyNmQ6MDAwMDAwZWI6MToyMzllMjE3OGU2ZDFhNzkxOjAwMDA1NWNmZWM3MDAyNmQ6MDAwMDAxOGEzNmMwMzM2ODowMDA2NGQ2ZTUwMjRiNjlmEAI=","custom":true,"fr":{"title":"Salade Piémontaise","difficulty":"Très facile","ingredients":["1 kg de pommes de terre à chair ferme, cuites et émincées","Œufs durs, tranchés","Cornichons, 1 petit pot, émincés","Tomates cerises, coupées en deux","1 échalote, finement hachée","1 pot de mayonnaise","Sel, poivre","Persil ou ciboulette (optionnel)"],"directions":"Mélanger tous les ingrédients ensemble. Servir très frais.","notes":"Ma version est un mix entre la salade piémontaise (sans jambon) et la salade de pommes de terre avec œufs durs.\n\nMiam!"},"en":{"title":"Piedmontese Potato Salad","difficulty":"Very easy","ingredients":["1 kg firm-fleshed potatoes, cooked and sliced","Hard-boiled eggs, sliced","Pickles, 1 small jar, sliced","Cherry tomatoes, halved","1 shallot, finely chopped","1 jar of mayonnaise","Salt and pepper","Parsley or chives (optional)"],"directions":"Mix all ingredients together. Serve very cold.","notes":"My version is a mix between Piedmontese salad (without ham) and potato salad with hard-boiled eggs."},"vi":{"title":"Ensalada Piemontesa","difficulty":"Sayon Kaayo","ingredients":["1 kg patatas nga niluto ug gilabha","Nilugang itlog, gilabha","Pickles, 1 gagmay nga garapon, gilabha","Cherry kamatis, gibahin","1 shallot, ginitis","1 garapon mayonnaise","Asin ug paminta","Parsley o chives (opsyonal)"],"directions":"Ihalo ang tanan nga sangkap. Ihatag nga bugnaw kaayo.","notes":"Ang akong bersyon kay halo sa Piedmontese salad (wala'y ham) ug patatas salad nga may nilugang itlog."},"ratings":{}},{"id":20,"emoji":"🫘","category":"plats","tags":["vege","healthy"],"author":"","servings":"4","prepTime":"10 min","cookTime":"25 min","totalTime":"35 min","bapRating":"","leahRating":"","photo":"https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcS5lkfTi0Kbnj1Q9hDp4ZbUdf5GpzGre5RDZw&s","custom":true,"fr":{"title":"Dal de Lentilles Corail au Lait de Coco","difficulty":"Facile","ingredients":["250 g lentilles corail rincées","1 boîte lait de coco (400 ml)","400 ml bouillon de légumes","1 oignon émincé","3 gousses d'ail","1 càc gingembre frais râpé","1 càc curcuma","1 càs garam masala","1 càc cumin","½ càc piment doux","1 boîte tomates concassées (400 g)","2 càs huile de coco","Sel","Coriandre fraîche","Jus de ½ citron","Riz basmati ou pain naan pour servir"],"directions":"Chauffer l'huile. Faire dorer l'oignon 5 min. Ajouter ail et gingembre, cuire 1 min.\nAjouter toutes les épices. Faire revenir 30 sec.\nAjouter les tomates, les lentilles, le bouillon et le lait de coco. Porter à ébullition.\nMijoter 20-25 min à découvert jusqu'à ce que les lentilles soient tendres. Presser le citron, ajuster le sel.\nGarnir de coriandre fraîche. Servir avec du riz basmati.","notes":"Se conserve 3-4 jours et se congèle très bien. Encore meilleur le lendemain !"},"en":{"title":"Red Lentil Dal with Coconut Milk","difficulty":"Easy","ingredients":["250 g red lentils, rinsed","1 can coconut milk (400 ml)","400 ml vegetable stock","1 sliced onion","3 garlic cloves","1 tsp fresh grated ginger","1 tsp turmeric","1 tbsp garam masala","1 tsp cumin","½ tsp mild chilli","1 can crushed tomatoes (400 g)","2 tbsp coconut oil","Salt","Fresh coriander","Juice of ½ lemon","Basmati rice or naan to serve"],"directions":"Heat oil. Brown onion 5 min. Add garlic and ginger, cook 1 min.\\nAdd all spices. Stir 30 sec.\\nAdd tomatoes, lentils, stock and coconut milk. Bring to a boil.\\nSimmer 20-25 min uncovered until lentils are tender. Squeeze lemon, adjust salt.\\nGarnish with fresh coriander. Serve with basmati rice.","notes":"Keeps 3-4 days and freezes perfectly. Even better the next day!"},"vi":{"title":"Dal nga Pula nga Lentil nga adunay Gatas sa Lubi","difficulty":"Sayon","ingredients":["250 g pula nga lentil, gihugas","1 lata gatas sa lubi (400 ml)","400 ml vegetable stock","1 sibuyas, gilabha","3 ulo bawang","1 kutsarita gibuak nga luya","1 kutsarita curcuma","1 kutsara garam masala","1 kutsarita cumin","½ kutsarita malumo nga sili","1 lata pinadurog nga kamatis (400 g)","2 kutsara lana sa lubi","Asin","Presko nga coriander","Katas sa ½ limon","Basmati rice o naan alang sa pagserbisyo"],"directions":"Painita ang lana. Iprito ang sibuyas og 5 minuto. Idugang ang bawang ug luya, lutua og 1 minuto.\\nIdugang ang tanan nga espesya. Kutason og 30 segundo.\\nIdugang ang kamatis, lentil, stock ug gatas sa lubi. Pakuloa.\\nPaligad og 20-25 minuto nga bukas hangtod ang lentil mahimong humok. Ipugos ang limon, ihuwat ang asin.\\nDekorahan og presko nga coriander. Ihatag nga may basmati rice.","notes":"Mabuhi og 3-4 ka adlaw ug hingpit nga ma-freeze. Mas lami pa sa sunod nga adlaw!"},"ratings":{}},{"id":17,"emoji":"🥣","category":"salades","tags":["vege","healthy"],"author":"Thomas Staub & Dr Jiří Dvořák","servings":"4","prepTime":"","cookTime":"30 min","totalTime":"30 min","bapRating":"","leahRating":"","photo":"https://lens.usercontent.google.com/banana?agsi=CmdnbG9iYWw6OjAwMDA1NWNmZWM3MDAyNmQ6MDAwMDAwZWI6MTphYWM4ZGE2NGUxYzJhNmY2OjAwMDA1NWNmZWM3MDAyNmQ6MDAwMDAxOGEzNmMwMzM2ODowMDA2NGQ2ZTM4YjkxODlmEAI=","custom":true,"fr":{"title":"Veggie Bowl","difficulty":"","ingredients":["300 g carottes","160 g persil-racine","240 g céleri-rave","280 g pommes de terre","8 g romarin","20 g huile de tournesol","PESTO : 8 g persil, 40 g jus de citron, zeste, 40 g huile d'olive, 8 g sel, 195 g feta"],"directions":"Mixer tous les ingrédients du pesto ensemble.\nRôtir les légumes (sauf pommes de terre) avec huile et sel à 230°C jusqu'à ce qu'ils restent fermes. Refroidir.\nCuire les pommes de terre en cubes marinés (huile, romarin, sel) à 180°C 20 min. Refroidir.\nMélanger légumes, pommes de terre et pesto. Dresser la feta marinée dans l'huile sur le dessus.","notes":""},"en":{"title":"Veggie Bowl","difficulty":"","ingredients":["300 g carrots","160 g parsley root","240 g celeriac","280 g potatoes","8 g rosemary","20 g sunflower oil","PESTO: 8 g parsley, 40 g lemon juice, zest, 40 g olive oil, 8 g salt, 195 g feta"],"directions":"Blend all pesto ingredients together.\\nRoast vegetables (except potatoes) with oil and salt at 230°C until firm. Cool.\\nCook cubed potatoes marinated in oil, rosemary and salt at 180°C for 20 min. Cool.\\nCombine vegetables, potatoes and pesto. Top with feta marinated in olive oil.","notes":""},"vi":{"title":"Utan nga Bowl","difficulty":"","ingredients":["300 g karot","160 g parsley root","240 g celeriac","280 g patatas","8 g rosemary","20 g sunflower oil","PESTO: 8 g parsley, 40 g katas sa limon, zest, 40 g olive oil, 8 g asin, 195 g feta"],"directions":"Ibungkag ang tanan nga sangkap sa pesto.\\nI-roast ang mga gulay (gawas ang patatas) nga may lana ug asin sa 230°C hangtod lig-on pa. Pabugnawa.\\nLutua ang patatas nga cubo nga gi-marinate sa lana, rosemary ug asin sa 180°C og 20 minuto. Pabugnawa.\\nIhalo ang mga gulay, patatas ug pesto. Butangan og feta nga gi-marinate sa lana sa ibabaw.","notes":""},"ratings":{}},{"id":10,"emoji":"🍗","category":"plats","tags":[],"author":"Gaston Gérard","servings":"4","prepTime":"","cookTime":"45 min","totalTime":"45 min","bapRating":"","leahRating":"","photo":"https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcQYNICSX0-ubzlY0ML7zT0Wl-LvWFMYGTF8QQ&s","custom":true,"fr":{"title":"Poulet Gaston Gérard","difficulty":"","ingredients":["1 poulet ou 4 cuisses","50 g beurre","1 oignon","3 gousses d'ail","2 càs moutarde à l'ancienne","1 càs paprika","150 ml vin blanc","250 g crème fraîche épaisse","150 g comté râpé","Sel et poivre"],"directions":"Préchauffer le four à 180°C.\nDorer le poulet dans le beurre à feu vif. Saler, papriquer. Retirer.\nFaire dorer oignon et ail. Déglacer avec le vin blanc, réduire de moitié. Ajouter moutarde, crème et 100 g comté. Remettre le poulet.\nParsemer 50 g comté, gratiner au four 25 min.\nServir avec pommes de terre, riz ou pâtes.","notes":""},"en":{"title":"Gaston Gérard Chicken","difficulty":"","ingredients":["1 whole chicken or 4 thighs","50 g butter","1 onion","3 garlic cloves","2 tbsp wholegrain mustard","1 tbsp paprika","150 ml white wine","250 g thick cream","150 g grated Comté","Salt and pepper"],"directions":"Preheat oven to 180°C.\\nBrown chicken in butter over high heat. Season and add paprika. Remove.\\nBrown onion and garlic. Deglaze with wine, reduce by half. Add mustard, cream and 100 g Comté. Return chicken.\\nSprinkle 50 g Comté, gratin in oven 25 min.\\nServe with potatoes, rice or pasta.","notes":""},"vi":{"title":"Manok Gaston Gérard","difficulty":"","ingredients":["1 tibuok manok o 4 ka paa","50 g mantequilya","1 sibuyas","3 ulo bawang","2 kutsara wholegrain mustard","1 kutsara paprika","150 ml puting bino","250 g espesong krema","150 g gibuak nga comté","Asin ug paminta"],"directions":"Painita ang hurno sa 180°C.\\nIprito ang manok sa mantequilya sa mainiton nga apoy. Timplahan ug paprika. Kuhaa.\\nIprito ang sibuyas ug bawang. Ibubo ang bino, ubsan sa katunga. Idugang ang mustard, krema ug 100 g comté. Iuli ang manok.\\nIwisik og 50 g comté, i-gratin sa hurno 25 minuto.\\nIhatag nga may patatas, bugas, o pasta.","notes":""},"ratings":{"papa":4,"juju":3}},{"id":14,"emoji":"🥦","category":"salades","tags":["vege","healthy"],"author":"Bryan Johnson","servings":"4","prepTime":"","cookTime":"20 min","totalTime":"20 min","bapRating":"","leahRating":"","photo":"https://art.whisk.com/image/upload/fl_progressive,h_560,w_560,c_fill,dpr_2/v1703281130/v3/user-recipes/a167d18e5f2da25be684ac2bd3a4fb8c.jpg","custom":true,"fr":{"title":"Super Veggie (Bryan Johnson)","difficulty":"","ingredients":["90 g lentilles noires sèches (~300 g cuites)","500 g brocoli (tête + tige)","300 g chou-fleur","100 g champignons shiitake ou maitake","2 gousses d'ail","6 g gingembre frais","2 citrons verts","2 càs cumin","2 càs vinaigre de cidre","2 càs graines de chanvre (si possible)","2 càs huile d'olive extra vierge"],"directions":"Bouillir brocoli, chou-fleur, champignons, gingembre et ail 7-9 min.\nCuire les lentilles 18-20 min al dente. Égoutter.\nMixer cumin, vinaigre, citron vert, lentilles et légumes. Texture de soupe épaisse.\nGarnir de graines de chanvre.","notes":"Bien préparé, le goût doit être doux et facile. Pas d'odeur d'ail."},"en":{"title":"Super Veggie (Bryan Johnson)","difficulty":"","ingredients":["90 g dry black lentils (~300 g cooked)","500 g broccoli (head + stalk)","300 g cauliflower","100 g shiitake or maitake mushrooms","2 garlic cloves","6 g fresh ginger","2 limes","2 tbsp cumin","2 tbsp apple cider vinegar","2 tbsp hemp seeds (if possible)","2 tbsp extra-virgin olive oil"],"directions":"Boil broccoli, cauliflower, mushrooms, ginger and garlic 7-9 min.\\nCook lentils 18-20 min al dente. Drain.\\nBlend cumin, vinegar, lime, lentils and vegetables into a thick soup texture.\\nTop with hemp seeds.","notes":"When properly made, the taste should be smooth and easy. No garlic smell."},"vi":{"title":"Super Utan (Bryan Johnson)","difficulty":"","ingredients":["90 g uga nga itom nga lentil (~300 g niluto)","500 g brokoli","300 g cauliflower","100 g shiitake o maitake nga uhong","2 ulo bawang","6 g presko nga luya","2 dayap nga berde","2 kutsara cumin","2 kutsara apple cider vinegar","2 kutsara hemp seeds","2 kutsara extra-virgin olive oil"],"directions":"Pakuloa ang brokoli, cauliflower, uhong, luya ug bawang og 7-9 minuto.\\nLutua ang lentil og 18-20 minuto al dente. Ilabay ang tubig.\\nIbungkag ang cumin, vinegar, dayap, lentil ug mga gulay hangtod mahimong espesong sopas.\\nDekorahan og hemp seeds.","notes":"Kung luto sa hustong paagi, ang lami kinahanglan nga hapsay ug sayon. Walay baho sa bawang."},"ratings":{}},{"id":1773982432909,"emoji":"🍽️","category":"plats","tags":[],"author":"Leah","servings":"6","prepTime":"10 min","cookTime":"20 min","totalTime":"20 min","bapRating":"","leahRating":"","photo":"https://www.fearlessdining.com/wp-content/uploads/2021/07/padron-pepper-chili-top.jpg","custom":true,"fr":{"title":"Chili aux Piments Padrón","difficulty":"Facile","ingredients":["450 g de bœuf haché","1/2 oignon haché","80 g de piments padrón (hachés, épépinés)","80 g de maïs en grains","80 g de courgette hachée","425 g de haricots rouges (1 boîte)","1 càs d'huile neutre","400 g de tomates concassées (1 boîte)","2 càs de poudre de chili","2 càc de cumin moulu","1 càc de sel","1/2 càc d'ail en poudre","1/4 càc de piment de Cayenne (optionnel)","1/2 càc d'origan séché","1/4 càc de flocons de piment (optionnel)"],"directions":"Dans une grande poêle, chauffer l'huile et faire revenir l'oignon 2 min à feu moyen.\nAjouter le bœuf haché, les piments padrón, le maïs et la courgette. Cuire jusqu'à ce que la viande soit dorée.\nVerser les tomates concassées et toutes les épices. Mélanger.\nRincer les haricots rouges et les ajouter. Mélanger de nouveau.\nCouvrir, baisser le feu et laisser mijoter 15 min.\nServir avec au choix : crème, cheddar, oignons rouges, coriandre fraîche ou chips tortilla émiettées.","notes":"Un chili copieux à base de viande hachée, de légumes et d'épices. Prêt en 30 minutes."},"en":{"title":"Padron Pepper Chili","difficulty":"","ingredients":["1 pound ground beef (* see note)","1/2 cup chopped onion","1/3 cup padron peppers (chopped, seeds removed)","1/2 cup corn kernels (* see note)","1/3 cup zucchini (chopped)","15 ounces kidney beans (* see note)","1 tbsp light oil","14 ounces diced tomatoes","2 tbsp chili powder","2 tsp ground cumin","1 tsp salt","1/2 tsp garlic powder","1/4 tsp ground cayenne pepper (optional)","1/2 tsp dried oregano","1/4 tsp crushed red peppers (optional)"],"directions":"In a large skillet or pan, add 1 tablespoon light oil and 1/2 cup chopped onion to the pan. Cook for 2 minutes on medium heat until the onions start to become translucent.\nAdd in 1 pound  ground beef , 1/3 cup padron peppers, 1/2 cup corn kernels, 1/3 cup zucchini, and cook until the meat is browned.\nPour in 14 ounces diced tomatoes. 2 tablespoons chili powder, 2 teaspoons ground cumin, 1 teaspoons salt, 1/2 teaspoon garlic powder, 1/4 teaspoon ground cayenne pepper, 1/2 teaspoon dried oregano, and 1/4 teaspoon crushed red peppers and mix.\nRinse the 15 ounces kidney beans in a colander and add to the pan. Mix again.\nCover and reduce the heat to medium low. Simmer for 15 minutes\nServe garnished with any of these: sour cream, cheddar cheese, scallions, chives, chopped red onion, and/or fresh cilantro. I like to add crushed tortilla chips too.","notes":"A delicious hearty chili made with ground meat, vegetables, and spices. It is ready in just 30 minutes."},"vi":{"title":"Chili nga adunay Padron Peppers","difficulty":"Sayon","ingredients":["450g ground beef","1/2 sibuyas","80g padron peppers","80g mais","80g kalabasa","425g kidney beans","1 kutsara lana","400g diced tomatoes","2 kutsara chili powder","2 kutsarita cumin","1 kutsarita asin","1/2 kutsarita garlic powder","1/4 kutsarita cayenne","1/2 kutsarita oregano","1/4 kutsarita red pepper flakes"],"directions":"Init-a ang lana. Lutoa ang sibuyas og 2 min.\nIdugang beef, peppers, mais, kalabasa. Lutoa.\nIdugang tomatoes ug spices. Haluin.\nIdugang kidney beans. Lutuon og 15 minuto.\nIserbi nga may sour cream ug cilantro.","notes":"Masustansya nga chili andam sulod sa 30 minuto."},"ratings":{},"tv":2},{"id":1773987959392,"emoji":"🧁","category":"desserts","tags":["gourmand"],"author":"Lili","servings":"6","prepTime":"10 min","cookTime":"20 min","totalTime":"10 min","bapRating":"","leahRating":"","photo":"https://www.cuisinetemeraire.fr/wp-content/uploads/2012/03/Gateau-Chocolat-Beurre-Sel.jpg","custom":true,"fr":{"title":"Gâteau au chocolat des Pirates - Fondant au chocolat inratable","difficulty":"","ingredients":["200 g chocolat","200 g beurre","150 g sucre","80 g farine","4 oeufs"],"directions":"Faire fondre le chocolat avec le beurre.\nDans un saladier, battre les œufs avec le sucre. Une fois que le mélange est bien mousseux, ajouter petit à petit la farine.\nVerser ensuite le chocolat et le beurre fondu. Mélanger et verser dans un moule à manqué.\nFaire cuire environ 20 minutes à 180°C (thermostat 6).","notes":"Tres gourmand , on peut faire avec moins de beurre, et un peu de levure pour le faire monter, et bien sur mettre plus de farine ou maizena pour plus de côté gâteau que fondant.\n\n\nDécouvrez la recette du Fondant au chocolat inratable, efficace et délicieuse. Un moment gourmand à partager entre amis ou en famille pour une parenthèse sucrée exquise. Ce fondant saura combler toutes vos envies avec ses ingrédients basiques que l'on a souvent dans ses placards. En quelques étapes seulement, vous obtiendrez un gâteau croustillant à l'extérieur et moelleux à cœur."},"en":{"title":"Pirates' Chocolate Fondant Cake","difficulty":"Easy","ingredients":["200g dark chocolate","200g butter","150g caster sugar","80g plain flour","4 eggs"],"directions":"Melt the chocolate with the butter.\nBeat the eggs with the sugar until fluffy, then gradually fold in the flour.\nPour in the melted chocolate and butter. Stir and pour into a greased cake tin.\nBake for 20 minutes at 180°C (fan 160°C).","notes":"Very indulgent — use less butter or add baking powder to make it rise more. Add extra flour or cornflour for a more cake-like texture."},"vi":{"title":"Chocolate Fondant Cake sa mga Pirata","difficulty":"Sayon","ingredients":["200g madyong tsokolate","200g mantekilya","150g asukar","80g harina","4 itlog"],"directions":"Tunawon ang tsokolate ug mantekilya.\nBuktunon ang itlog ug asukar, idugang ang harina.\nIsagol ang tsokolate. Ibubo sa amolde.\nI-bake og 20 minuto sa 180°C.","notes":"Matam-is kaayo — mahimo gamay nga mantekilya o idugang baking powder."},"ratings":{"papa":5},"tv":2},{"id":1773987555720,"emoji":"🍽️","category":"desserts","tags":["comfort","pas trop gourmand","g n hour, or until a toothpick comes out clean.\nCool completely before serving.\nEnjoy!","notes":"Peut le faire vraiment sans sucre pour les enfants !"},"vi":{"title":"Banana Bread","difficulty":"Sayon","ingredients":["3 hinog nga saging","75g tinunaw nga mantekilya","20g asukar","1 itlog","1 kutsarita vanilla","1 kutsarita baking soda","asin","185g harina","85g chocolate chips"],"directions":"Preheat oven sa 180°C.\nDugmokon ang mga saging. Idugang mantekilya, asukar, itlog, vanilla, baking soda, asin, harina.\nIdugang chocolate chips. Ibubo sa amolde.\nI-bake og 50 minuto.","notes":"Mahimo nga walay asukar para sa mga bata!"},"ratings":{"papa":5},"tv":2},{"id":1773987051862,"emoji":"🍗","category":"plats","tags":["Mediteranean"],"author":"Bonbon & Manu","servings":"6","prepTime":"10 min","cookTime":"60 min","totalTime":"70 min","bapRating":"","leahRating":"","photo":"https://www.themediterraneandish.com/wp-content/uploads/2022/10/chicken-marbella-recipe-3.jpg","custom":true,"fr":{"title":"Poulet Marbella (ottolenghi)","difficulty":"Facile","ingredients":["1 poulet entier découpé","3 feuilles de laurier","1 tête d'ail épluchée","125g de pruneaux dénoyautés","125g d'olives vertes espagnoles","60g de câpres avec jus","60ml de vinaigre de vin rouge","60ml d'huile d'olive","2 c.à.s d'origan séché","Sel et poivre","125ml de vin blanc","60g de cassonade","2 c.à.s de persil (optionnel)"],"directions":"Découper le poulet.\nPréparer la marinade : mélanger laurier, ail, pruneaux, olives, câpres, vinaigre, huile, origan, sel, poivre. Ajouter le poulet et enrober. Glisser sous la peau.\nMariner toute la nuit (30 min minimum).\nPréchauffer le four à 175°C. Mettre le poulet et la marinade dans un plat, verser le vin, saupoudrer de cassonade. Cuire 50–60 min.\nFaire réduire les jus. Servir nappé de sauce et de persil.","notes":"Recette classique du Silver Palate Cookbook (1982). Sucre réduit : les pruneaux apportent déjà toute la douceur !"},"en":{"title":"Chicken Marbella","difficulty":"Medium","ingredients":["1 whole chicken, (cut up)","3 bay leaves","1 head garlic, (peeled)","1/2 cup pitted prunes","1/2 cup pitted Spanish green olives","1/4 cup capers, (with a little bit of juice)","1/4 cup red wine vinegar","1/4 cup Early Harvest Greek extra virgin olive oil","2 tbsp dried oregano","Kosher salt","pepper","1/2 cup white wine","1/4 cup brown sugar","2 tbsp chopped parsley, (optional)"],"directions":"Cut the chicken: Take a whole chicken and using sharp kitchen scissors cut the backbone out. Then press down on top to separate the rest of the bones. Remove the legs and thighs, then remove the wings and tips.\nMake the marinade: In a large bowl combine bay leaves, garlic cloves, prunes, olives, capers, red wine vinegar, olive oil, dried oregano, salt, and pepper. Stir it together then add the chicken. And smoosh it around. Make sure you lift up the skin a little bit so the marinade clings to the flesh of the chicken as well.\nLet the chicken sit: Cover the bowl and place it in the fridge overnight. (If you don’t have enough time, allow at least 30 minutes of marinating time.)\nRoast the chicken: The next day preheat the oven to 350°F. Transfer the chicken and the marinade, including the prunes, olives, etc., into a large oven safe skillet or baking dish and spread it out a bit so the chicken pieces don’t overlap. Pour the wine into the baking dish. Sprinkle the top of the chicken with brown sugar and place in the oven for 50 to 60 minutes. Baste with the pan juices a couple of times while the chicken cooks.\nRemove from the oven: The chicken is ready when its internal temperature reaches 165°F and the skin has turned a golden brown. Transfer the chicken to a large serving platter and spoon the prunes, olives, and capers on top.\nMake the sauce and serve. Bring the juices in the roasting pan to a boil over medium heat and reduce until you are left with about 1/2 cup of sauce. Strain the sauce into a bowl, then pour it over the chicken. Sprinkle with chopped parsley. Serve and enjoy!","notes":"Chicken Marbella is a classic recipe from the famous 1982 Silver Palate Cookbook. The original recipe is made to serve a crowd but one chicken is enough for my family. I also reduced the sugar in the recipe from 1 cup to 1/4 cup. The prunes add most of the sweetness in this recipe and it’s perfection!"},"vi":{"title":"Manok sa Marbella","difficulty":"Sayon","ingredients":["1 buong manok giputol","3 laurel","1 ulo bawang","125g prunas","125g green olives","60g capers","60ml red wine vinegar","60ml olive oil","2 kutsara oregano","Asin, paminta","125ml puting alak","60g brown sugar","2 kutsara perehil"],"directions":"Putla ang manok.\nIsagol ang laurel, bawang, prunas, olives, capers, suka, olive oil, oregano, asin, paminta. Idugang ang manok.\nI-marinate og tibuok gabii sa ref.\nPreheat oven sa 175°C. Ibutang sa baking dish, ibubo ang alak, wisiki og sugar. I-bake og 50–60 min.\nIserbi nga may sauce ug perehil.","notes":"Classic gikan sa Silver Palate Cookbook (1982). Tam-is na ang mga prunas!"},"ratings":{"tita":5},"tv":2},{"id":1779800000001,"emoji":"🍗","category":"plats","tags":["filipino","famille","easy"],"author":"Famille Howatson","servings":"4","prepTime":"15","cookTime":"45","totalTime":"60","bapRating":"","leahRating":"","photo":"https://upload.wikimedia.org/wikipedia/commons/thumb/9/9f/Adobongmanok.jpg/1024px-Adobongmanok.jpg","custom":true,"fr":{"title":"Adobo de Poulet (Filipino)","difficulty":"Facile","ingredients":["1 kg de pilons et hauts de cuisse de poulet","120 ml de sauce soja","120 ml de vinaigre blanc (ou de canne)","6 gousses d'ail écrasées","4 feuilles de laurier","1 c. à café de grains de poivre","1 c. à soupe de sucre roux","250 ml d'eau","Riz blanc, pour servir"],"directions":"Faire mariner le poulet avec la sauce soja, le vinaigre et l'ail 30 min à 1 h.\nDans une grande cocotte, verser le poulet et sa marinade, ajouter le laurier, le poivre, le sucre et l'eau.\nPorter à ébullition à découvert, puis baisser le feu et laisser mijoter 30 min en remuant de temps en temps.\nRetirer le couvercle, monter le feu et laisser réduire 10–15 min jusqu'à ce que la sauce nappe le poulet.\nServir bien chaud sur du riz blanc.","notes":"🇵🇭 Classique des Visayas — plus c'est mariné, meilleur c'est. Se garde 3 jours au frigo et c'est encore meilleur le lendemain !"},"en":{"title":"Filipino Chicken Adobo","difficulty":"Easy","ingredients":["1 kg chicken drumsticks and thighs","120 ml soy sauce","120 ml white or cane vinegar","6 garlic cloves, crushed","4 bay leaves","1 tsp whole peppercorns","1 tbsp brown sugar","250 ml water","Steamed white rice, to serve"],"directions":"Marinate the chicken with soy sauce, vinegar and garlic for 30 min to 1 h.\nPour everything into a large pot, add bay leaves, peppercorns, sugar and water.\nBring to a boil uncovered, then lower the heat and simmer for 30 min, stirring occasionally.\nRemove the lid, raise the heat and reduce for 10–15 min until the sauce coats the chicken.\nServe hot over steamed rice.","notes":"🇵🇭 Classic Visayan family dish — the longer it marinates, the better. Keeps 3 days in the fridge and tastes even better the next day!"},"vi":{"title":"Adobong Manok","difficulty":"Sayon","ingredients":["1 kg drumstick ug paa sa manok","120 ml toyo","120 ml suka","6 ka ahos, dinukdok","4 ka dahon sa laurel","1 kutsarita nga buo nga paminta","1 kutsara nga brown sugar","250 ml tubig","Linuto nga bugas, alang sa pag-serbi"],"directions":"Itinapot ang manok sa toyo, suka ug ahos sulod sa 30 min hangtod 1 oras.\nIbutang ang tanan sa kaldero, idugang ang dahon sa laurel, paminta, asukar ug tubig.\nPalutoa nga ubos ang takip hangtod mubukal, dayon hinayan ug palutoa 30 min.\nTangtanga ang takip, kusgi ang kalayo, ug palutoa 10–15 min hangtod hugot ang sarsa sa manok.\nI-serbi nga init ibabaw sa bugas.","notes":"🇵🇭 Klasikong pamana sa kusina sa Visaya — mas lami kung hatdon og dugay nga magpaaslom. Sulod sa 3 ka adlaw sa frigorifik, mas lami pa kini ugma!"},"ratings":{"mummy":null,"papa":null,"juju":null,"artie":null,"tita":null}},{"id":1779800000002,"emoji":"🥞","category":"desserts","tags":["fun","kids","japonais"],"author":"Bap","servings":"2","prepTime":"15","cookTime":"15","totalTime":"30","bapRating":"","leahRating":"","photo":"https://upload.wikimedia.org/wikipedia/commons/thumb/d/db/Souffl%C3%A9_pancake.jpg/1024px-Souffl%C3%A9_pancake.jpg","custom":true,"fr":{"title":"Pancakes Soufflés Japonais","difficulty":"Moyen","ingredients":["2 jaunes d'œufs","3 blancs d'œufs","40 g de sucre","30 g de farine","1/2 c. à café de levure chimique","30 ml de lait","1 c. à café d'extrait de vanille","Beurre pour la poêle","Sirop d'érable & fruits frais pour servir"],"directions":"Mélanger les jaunes, le lait, la vanille, puis ajouter farine et levure tamisées.\nMonter les blancs en neige avec le sucre ajouté en 3 fois, jusqu'à obtenir une meringue brillante et ferme.\nIncorporer délicatement 1/3 de la meringue à la pâte, puis le reste en soulevant la masse pour garder l'air.\nChauffer une poêle anti-adhésive à feu très doux avec un peu de beurre. Empiler 2 grosses cuillerées de pâte pour former de hautes piles.\nCouvrir, cuire 4–5 min, ajouter 1 cuillère à soupe d'eau dans la poêle (pas sur les pancakes) pour la vapeur, retourner délicatement et cuire encore 4–5 min.\nServir aussitôt avec sirop d'érable et fruits frais.","notes":"🥞 Fun et photogéniques ! Le secret : cuisson très lente à couvert. Plus la pâte est haute, plus c'est spectaculaire."},"en":{"title":"Japanese Soufflé Pancakes","difficulty":"Medium","ingredients":["2 egg yolks","3 egg whites","40 g sugar","30 g plain flour","1/2 tsp baking powder","30 ml milk","1 tsp vanilla extract","Butter for the pan","Maple syrup & fresh fruit to serve"],"directions":"Whisk yolks, milk and vanilla. Sift in flour and baking powder, mix until smooth.\nWhip the egg whites, adding the sugar in 3 batches, until you get a glossy firm meringue.\nFold 1/3 of the meringue into the yolk batter, then gently fold in the rest, keeping the air in.\nHeat a non-stick pan on very low heat with a little butter. Pile 2–3 big spoonfuls of batter on top of each other to make tall stacks.\nCover and cook 4–5 min, add a tablespoon of water to the pan (not on the pancakes) for steam, flip very gently, cook another 4–5 min.\nServe immediately with maple syrup and fresh fruit.","notes":"🥞 Fun and photogenic! The secret is very slow heat with a lid. The taller the stack, the more spectacular."},"vi":{"title":"Hapon nga Soufflé Pancakes","difficulty":"Tunga","ingredients":["2 ka pula sa itlog","3 ka puti sa itlog","40 g asukar","30 g harina","1/2 kutsarita nga baking powder","30 ml gatas","1 kutsarita nga vanilla","Mantequilya alang sa kalaha","Maple syrup ug bag-ong prutas alang sa pag-serbi"],"directions":"Sagolon ang pula sa itlog, gatas ug vanilla. Idugang ang harina ug baking powder.\nI-whip ang puti sa itlog, idugang ang asukar sa 3 ka bahin hangtod humot kaayo.\nIdugang ang 1/3 nga meringue sa pula, dayon ang nahibilin, dahandahan aron dili maguba ang bula.\nPainita ang kalaha sa hinay nga kalayo, butangan og mantequilya, ibutang ang taas nga stack sa pancake batter.\nTabuni ug palutoa 4–5 min, butangi og 1 kutsara nga tubig sa kalaha (dili sa pancake), liso, palutoa 4–5 min.\nI-serbi dayon nga adunay maple syrup ug prutas.","notes":"🥞 Fun ug photogenic! Ang sekreto kay hinay nga kalayo nga adunay tabon. Mas taas, mas matahum."},"ratings":{"mummy":null,"papa":null,"juju":null,"artie":null,"tita":null}},{"id":1779800000003,"emoji":"🍕","category":"plats","tags":["fun","kids","rapide","no-oven"],"author":"Bap & Leah","servings":"4","prepTime":"1h10","cookTime":"15","totalTime":"85","bapRating":"","leahRating":"","photo":"https://upload.wikimedia.org/wikipedia/commons/thumb/a/a3/Eq_it-na_pizza-margherita_sep2005_sml.jpg/1024px-Eq_it-na_pizza-margherita_sep2005_sml.jpg","custom":true,"fr":{"title":"Pizza à la Poêle (sans four)","difficulty":"Facile","ingredients":["Pâte : 300 g de farine","Pâte : 180 ml d'eau tiède","Pâte : 1 c. à café de sucre","Pâte : 1 sachet de levure boulangère sèche (7 g)","Pâte : 1 c. à café de sel","Pâte : 2 c. à soupe d'huile d'olive","Garniture : 150 ml de sauce tomate","Garniture : 1 boule de mozzarella en tranches","Garniture : Origan, basilic frais","Garniture : Olives, jambon, légumes — au choix"],"directions":"Mélanger farine, sel, sucre et levure dans un grand bol. Ajouter l'eau et l'huile, pétrir 5 min jusqu'à obtenir une pâte souple. Couvrir et laisser pousser 1 h.\nÉtaler la pâte au diamètre de votre poêle (24–28 cm).\nHuiler la poêle, déposer la pâte, faire cuire à feu moyen-doux 5 min jusqu'à ce que la base soit dorée.\nRetourner la pâte, étaler la sauce tomate, ajouter la mozzarella et les garnitures de votre choix.\nCouvrir avec un couvercle et laisser cuire 6–8 min à feu doux jusqu'à ce que le fromage soit bien fondu.\nParsemer d'origan et de basilic frais. Servir aussitôt.","notes":"🍕 Parfait pour les soirs sans four ! Les enfants adorent garnir leur propre part. La cuisson à couvert imite parfaitement le four."},"en":{"title":"No-Oven Pan Pizza","difficulty":"Easy","ingredients":["Dough: 300 g flour","Dough: 180 ml warm water","Dough: 1 tsp sugar","Dough: 1 sachet dry yeast (7 g)","Dough: 1 tsp salt","Dough: 2 tbsp olive oil","Topping: 150 ml tomato sauce","Topping: 1 ball mozzarella, sliced","Topping: Oregano, fresh basil","Topping: Olives, ham, veggies — whatever you fancy"],"directions":"Mix flour, salt, sugar and yeast in a large bowl. Add water and olive oil, knead 5 min until smooth. Cover and let rise for 1 h.\nRoll out the dough to the size of your pan (24–28 cm).\nOil the pan, lay the dough in, cook on medium-low for 5 min until the base is golden.\nFlip the dough, spread the tomato sauce, add mozzarella and toppings.\nCover with a lid and cook 6–8 min on low until the cheese is melted.\nTop with oregano and fresh basil, serve right away.","notes":"🍕 Perfect for oven-less nights! Kids love topping their own slice. Cooking with a lid mimics the oven beautifully."},"vi":{"title":"Pizza sa Kalaha (Walay Hurno)","difficulty":"Sayon","ingredients":["Masa: 300 g harina","Masa: 180 ml init nga tubig","Masa: 1 kutsarita nga asukar","Masa: 1 sachet sa dry yeast (7 g)","Masa: 1 kutsarita nga asin","Masa: 2 kutsara nga olive oil","Palaman: 150 ml sa tomato sauce","Palaman: 1 ka bola sa mozzarella, hinugway","Palaman: Oregano, lab-as nga basil","Palaman: Olibo, jamon, utan — bisan unsa"],"directions":"Sagolon ang harina, asin, asukar ug yeast. Idugang ang tubig ug lana, mas-pag 5 min hangtod hapsay. Tabuni ug papahuwaya sulod sa 1 oras.\nI-roll ang masa sa gilapdon sa imong kalaha (24–28 cm).\nLan-i ang kalaha, ibutang ang masa, lutoa sa medium-low 5 min hangtod golden.\nLiso, ipakatag ang tomato sauce, idugang mozzarella ug palaman.\nTabuni ug lutoa 6–8 min sa hinay nga kalayo hangtod natunaw ang keso.\nButangi og oregano ug basil, i-serbi dayon.","notes":"🍕 Maayo para sa mga gabii nga walay hurno! Ganahan ang mga bata mag-topping. Ang tabon nag-imitar sa hurno."},"ratings":{"mummy":null,"papa":null,"juju":null,"artie":null,"tita":null}},{"id":1783300000001,"emoji":"🍗","category":"plats","tags":["sans gluten","sans œufs","sans lait"],"author":"","servings":"6","prepTime":"20 min","cookTime":"45 min","totalTime":"1 h 05","photo":null,"tv":1,"fr":{"title":"Poulet Basquaise au Riz","difficulty":"Facile","ingredients":["8 hauts de cuisse de poulet","3 poivrons (rouge, vert, jaune) émincés","2 oignons émincés","4 gousses d'ail émincées","800 g de tomates concassées (2 boîtes)","150 ml de vin blanc sec (optionnel)","3 càs d'huile d'olive","1 càc de piment d'Espelette","1 feuille de laurier","1 branche de thym","Sel et poivre","350 g de riz blanc pour servir"],"directions":"Chauffer l'huile dans une grande cocotte. Faire dorer les morceaux de poulet 5 min de chaque côté. Réserver.\nDans la même cocotte, faire revenir les oignons 5 min. Ajouter les poivrons et l'ail, cuire 5 min.\nRemettre le poulet. Ajouter les tomates, le vin blanc, le piment d'Espelette, le laurier et le thym. Saler, poivrer.\nCouvrir et laisser mijoter à feu doux 35-40 min, jusqu'à ce que le poulet soit fondant.\nPendant ce temps, cuire le riz. Servir le poulet et sa sauce sur le riz, bien chaud.","notes":"Un classique du Sud-Ouest, naturellement sans gluten, sans œufs et sans lait. Encore meilleur réchauffé le lendemain !"},"en":{"title":"Basque Chicken with Rice","difficulty":"Easy","ingredients":["8 chicken thighs","3 bell peppers (red, green, yellow), sliced","2 onions, sliced","4 garlic cloves, minced","800 g crushed tomatoes (2 tins)","150 ml dry white wine (optional)","3 tbsp olive oil","1 tsp Espelette pepper (or mild chili)","1 bay leaf","1 sprig of thyme","Salt and pepper","350 g white rice, to serve"],"directions":"Heat the oil in a large pot. Brown the chicken pieces 5 min per side. Set aside.\nIn the same pot, sauté the onions 5 min. Add the peppers and garlic, cook 5 min.\nReturn the chicken. Add tomatoes, white wine, Espelette pepper, bay leaf and thyme. Season.\nCover and simmer on low heat 35-40 min, until the chicken is tender.\nMeanwhile, cook the rice. Serve the chicken and its sauce over the rice, piping hot.","notes":"A southwest-France classic, naturally gluten-free, egg-free and dairy-free. Even better reheated the next day!"},"vi":{"title":"Basque nga Manok nga adunay Kan-on","difficulty":"Sayon","ingredients":["8 ka paa sa manok","3 ka bell pepper (pula, berde, dalag), hiniwa","2 ka sibuyas, hiniwa","4 ka buok ahos, gidugmok","800 g dinugmok nga kamatis (2 ka lata)","150 ml puti nga bino (opsyonal)","3 kutsara lana sa olibo","1 kutsarita Espelette nga sili (o hinay nga sili)","1 dahon sa laurel","1 sanga sa thyme","Asin ug paminta","350 g puti nga bugas, isilbi"],"directions":"Init-a ang lana sa dako nga kaldero. Prituha ang manok og 5 min matag kilid. Ilain.\nSa mao gihapon nga kaldero, igisa ang sibuyas og 5 min. Idugang ang bell pepper ug ahos, lutoa og 5 min.\nIbalik ang manok. Idugang ang kamatis, bino, sili, laurel ug thyme. Timplahi.\nTaboni ug pabukala sa hinay nga kalayo og 35-40 min, hangtod humok ang manok.\nSamtang naghulat, lutoa ang kan-on. Isilbi ang manok ug sarsa ibabaw sa kan-on, init kaayo.","notes":"Klasiko nga putahe sa Pransya: walay gluten, walay itlog ug walay gatas. Mas lami pa kung initon pag-usab!"}},{"id":1783300000002,"emoji":"🍠","category":"plats","tags":["sans gluten","sans œufs","sans lait"],"author":"","servings":"6","prepTime":"25 min","cookTime":"45 min","totalTime":"1 h 10","photo":null,"tv":1,"fr":{"title":"Parmentier de Bœuf à la Patate Douce","difficulty":"Facile","ingredients":["1 kg de patates douces pelées, en cubes","600 g de bœuf haché","1 oignon haché","2 carottes en petits dés","2 gousses d'ail émincées","2 càs de concentré de tomate","200 ml de bouillon de bœuf (sans gluten)","4 càs d'huile d'olive","1 càc de cumin moulu","1 càc de paprika doux","Sel et poivre","Persil frais ciselé"],"directions":"Cuire les patates douces 15-20 min dans l'eau bouillante salée, jusqu'à ce qu'elles soient tendres.\nLes écraser avec 2 càs d'huile d'olive. Saler, poivrer. Réserver.\nFaire revenir l'oignon et les carottes dans le reste d'huile 5 min. Ajouter l'ail et le bœuf. Cuire jusqu'à coloration.\nAjouter le concentré de tomate, le cumin, le paprika et le bouillon. Mijoter 10 min. Rectifier l'assaisonnement.\nDans un plat à gratin, étaler la viande puis couvrir de purée de patate douce. Strier à la fourchette.\nEnfourner 20 min à 200°C jusqu'à ce que le dessus soit doré. Parsemer de persil et servir bien chaud.","notes":"Version réconfortante et sans lactose du hachis parmentier : la purée à l'huile d'olive est onctueuse sans beurre ni lait."},"en":{"title":"Sweet Potato Shepherd's Pie","difficulty":"Easy","ingredients":["1 kg sweet potatoes, peeled and cubed","600 g ground beef","1 onion, chopped","2 carrots, finely diced","2 garlic cloves, minced","2 tbsp tomato paste","200 ml beef stock (gluten-free)","4 tbsp olive oil","1 tsp ground cumin","1 tsp sweet paprika","Salt and pepper","Fresh parsley, chopped"],"directions":"Boil the sweet potatoes in salted water 15-20 min until tender.\nMash with 2 tbsp olive oil. Season. Set aside.\nSauté the onion and carrots in the remaining oil 5 min. Add garlic and beef. Cook until browned.\nAdd tomato paste, cumin, paprika and stock. Simmer 10 min. Adjust seasoning.\nSpread the meat in a baking dish, top with the sweet potato mash. Rake with a fork.\nBake 20 min at 200°C until golden. Sprinkle with parsley and serve piping hot.","notes":"A comforting dairy-free twist on shepherd's pie: the olive-oil mash is silky without butter or milk."},"vi":{"title":"Shepherd's Pie nga Kamote","difficulty":"Sayon","ingredients":["1 kg kamote, gipanitan ug gihiwa","600 g giling nga baka","1 sibuyas, tinadtad","2 ka karot, gidais og gagmay","2 ka buok ahos, gidugmok","2 kutsara tomato paste","200 ml sabaw sa baka (walay gluten)","4 kutsara lana sa olibo","1 kutsarita cumin","1 kutsarita paprika","Asin ug paminta","Presko nga perehil, tinadtad"],"directions":"Lutoa ang kamote sa nagbukal nga tubig og 15-20 min hangtod humok.\nDugmoka uban ang 2 kutsara lana sa olibo. Timplahi. Ilain.\nIgisa ang sibuyas ug karot og 5 min. Idugang ang ahos ug baka. Lutoa hangtod moitom.\nIdugang ang tomato paste, cumin, paprika ug sabaw. Pabukala og 10 min.\nIbutang ang karne sa lutoanan, tabuni sa dinugmok nga kamote. Kudlita og tinidor.\nLutoa sa hurno og 20 min sa 200°C hangtod bulawanon. Sabwagi og perehil ug isilbi nga init.","notes":"Makapahupay nga putahe nga walay gatas: lami ang dinugmok nga kamote bisan walay mantikilia."}},{"id":1783300000003,"emoji":"🍲","category":"plats","tags":["sans gluten","sans œufs","sans lait"],"author":"","servings":"6","prepTime":"20 min","cookTime":"50 min","totalTime":"1 h 10","photo":null,"tv":1,"fr":{"title":"Sinigang na Baboy (Soupe Philippine au Tamarin)","difficulty":"Facile","ingredients":["1 kg de travers ou d'épaule de porc en morceaux","2 litres d'eau","1 oignon en quartiers","2 tomates en quartiers","200 g de radis blanc (labanos) en rondelles","200 g de haricots verts longs (sitaw)","1 aubergine en tronçons","200 g de kangkong ou d'épinards","100 g de pâte de tamarin (ou 1 sachet de mix sinigang sans gluten)","2 piments verts entiers (optionnel)","2 càs de sauce poisson (patis)","Riz blanc pour servir"],"directions":"Dans une grande marmite, porter l'eau à ébullition avec le porc, l'oignon et les tomates. Écumer.\nCouvrir et laisser mijoter 35-40 min, jusqu'à ce que le porc soit tendre.\nAjouter le tamarin et la sauce poisson. Goûter : le bouillon doit être bien acidulé.\nAjouter le radis, cuire 5 min. Ajouter les haricots, l'aubergine et les piments, cuire 5 min.\nAjouter le kangkong ou les épinards en dernier, juste 1 min.\nServir fumant avec du riz blanc. Chacun ajuste avec un peu de patis.","notes":"LA soupe réconfortante des Philippines : acidulée, chaude et généreuse. Naturellement sans gluten, sans œufs et sans lait."},"en":{"title":"Sinigang na Baboy (Filipino Sour Pork Soup)","difficulty":"Easy","ingredients":["1 kg pork ribs or shoulder, cut in chunks","2 litres water","1 onion, quartered","2 tomatoes, quartered","200 g white radish (labanos), sliced","200 g long green beans (sitaw)","1 eggplant, cut in chunks","200 g kangkong (water spinach) or spinach","100 g tamarind paste (or 1 packet gluten-free sinigang mix)","2 whole green chilies (optional)","2 tbsp fish sauce (patis)","White rice, to serve"],"directions":"In a large pot, bring the water to a boil with the pork, onion and tomatoes. Skim.\nCover and simmer 35-40 min, until the pork is tender.\nAdd the tamarind and fish sauce. Taste: the broth should be pleasantly sour.\nAdd the radish, cook 5 min. Add the beans, eggplant and chilies, cook 5 min.\nAdd the kangkong or spinach last, just 1 min.\nServe steaming hot with white rice. Adjust with a splash of patis at the table.","notes":"THE comforting soup of the Philippines: sour, hot and generous. Naturally gluten-free, egg-free and dairy-free."},"vi":{"title":"Sinigang nga Baboy","difficulty":"Sayon","ingredients":["1 kg gusok o abaga sa baboy, hiniwa","2 litro tubig","1 sibuyas, gikwarto","2 ka kamatis, gikwarto","200 g labanos, hiniwa","200 g sitaw","1 talong, hiniwa","200 g kangkong o spinaka","100 g sampalok nga paste (o 1 pakete sinigang mix nga walay gluten)","2 ka berde nga sili (opsyonal)","2 kutsara patis","Kan-on, isilbi"],"directions":"Sa dako nga kaldero, pabukala ang tubig uban ang baboy, sibuyas ug kamatis. Kuhaa ang bula.\nTaboni ug pabukala og 35-40 min hangtod humok ang baboy.\nIdugang ang sampalok ug patis. Tilawi: kinahanglan aslom ang sabaw.\nIdugang ang labanos, lutoa og 5 min. Idugang ang sitaw, talong ug sili, lutoa og 5 min.\nIdugang ang kangkong sa kataposan, 1 min lang.\nIsilbi nga init uban ang kan-on.","notes":"ANG makapahupay nga sabaw sa Pilipinas: aslom, init ug daghan. Walay gluten, walay itlog, walay gatas."}}];/* ── GitHub Gist Sync ── */function loadSyncConfig(){try{var stored=JSON.parse(localStorage.getItem(SYNC_CONFIG_KEY)||'null');return(stored&&stored.gistId&&stored.token)?stored:DEFAULT_SYNC_CONFIG;}catch(e){return DEFAULT_SYNC_CONFIG;}}function saveSyncConfig(cfg){try{if(cfg)localStorage.setItem(SYNC_CONFIG_KEY,JSON.stringify(cfg));else localStorage.removeItem(SYNC_CONFIG_KEY);}catch(e){}}function appConfirm(msg,okLabel,cancelLabel,onOk){try{var old=document.getElementById('app-confirm');if(old&&old.parentNode)old.parentNode.removeChild(old);var ov=document.createElement('div');ov.id='app-confirm';ov.className='ac-ovl';var box=document.createElement('div');box.className='ac-box';var me=document.createElement('div');me.className='ac-msg';me.textContent=msg;var bts=document.createElement('div');bts.className='ac-btns';var bc=document.createElement('button');bc.className='ac-cancel';bc.textContent=cancelLabel;va
